  <script>
    /* iOS A2HS: lock fill height before first paint.
       Phone: screen.height > inner → use screen.
       iPad: screen.* often *undershoots* inner → add safe-area extra. */
    (function () {
      var n = window.navigator;
      var standalone =
        n.standalone === true ||
        window.matchMedia("(display-mode: standalone)").matches ||
        window.matchMedia("(display-mode: fullscreen)").matches;
      if (!standalone) return;
      var root = document.documentElement;
      root.classList.add("pwa-standalone");
      var iw = window.innerWidth || 0;
      var ih = window.innerHeight || 0;
      var sw = window.screen.width || 0;
      var sh = window.screen.height || 0;
      var screenMax = Math.max(sw, sh);
      var screenMin = Math.min(sw, sh);
      var fillH = ih >= iw ? Math.max(ih, screenMax) : Math.max(ih, screenMin);
      var extra = 0;
      if (Math.min(iw, ih) >= 600 && screenMax < ih - 10) {
        extra = 20; /* refined to real insetB once body exists */
      }
      root.style.setProperty("--pwa-fill-h", fillH + "px");
      root.style.setProperty("--pwa-extra-b", extra + "px");
    })();
    /* Tablet class before first paint so the bottom lift does not flash in. */
    (function () {
      var minSide = Math.min(window.innerWidth || 0, window.innerHeight || 0);
      if (minSide < 600) return;
      var touch = (navigator.maxTouchPoints || 0) > 1;
      var coarse = window.matchMedia("(pointer: coarse)").matches;
      var noHover = window.matchMedia("(hover: none)").matches;
      if (touch || coarse || noHover) document.documentElement.classList.add("is-tablet");
    })();
  </script>

      --mono: "Inter", system-ui, sans-serif;
      --font: "Inter", system-ui, sans-serif;
      /* Compact instrument labels */
      --label-size: 8px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      min-height: -webkit-fill-available;
      overflow: hidden;
      background: #020308;
      color: var(--text);
      font-family: var(--font);
      -webkit-text-size-adjust: 100%;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    input,
    textarea {
      -webkit-user-select: text;
      user-select: text;
    }

    /*
     * Full-bleed GL stack. Do NOT use max-height:100dvh — undershoots on iOS.
     * Safari: env() overpaint. Home-screen PWA: height locked to screen (see JS)
     * because innerHeight stays short of screen.height and clips env() overshoot.
     */
    #stage,
    #earth-host,
    #touch-plane {
      position: fixed;
      top: calc(-1 * env(safe-area-inset-top, 0px));
      right: calc(-1 * env(safe-area-inset-right, 0px));
      bottom: calc(-1 * env(safe-area-inset-bottom, 0px));
      left: calc(-1 * env(safe-area-inset-left, 0px));
      pointer-events: none;
    }

    html.pwa-standalone,
    html.pwa-standalone body {
      height: calc(var(--pwa-fill-h, 100%) + var(--pwa-extra-b, 0px));
      min-height: calc(var(--pwa-fill-h, 100%) + var(--pwa-extra-b, 0px));
    }

    html.pwa-standalone #stage,
    html.pwa-standalone #earth-host,
    html.pwa-standalone #touch-plane {
      top: 0;
      right: 0;
      bottom: auto;
      left: 0;
      width: 100%;
      height: calc(var(--pwa-fill-h, 100%) + var(--pwa-extra-b, 0px));
    }

    /* Clips the oversized GL canvas; black matches clear color */
    #earth-host {
      z-index: 1;
      overflow: hidden;
      background: #020308;
      pointer-events: none;
    }

    /* Gesture layer above canvas, under real UI controls.
       Hits stay off so PWA buttons/hints receive taps; globe uses window capture. */
    #touch-plane {
      z-index: 2;
      touch-action: none;
      background: transparent;
      pointer-events: none;
    }

    #earth-canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      pointer-events: none;
      cursor: grab;
      opacity: 0;
      transition: opacity 0.2s ease;
      background: #020308;
    }

    #earth-canvas.is-ready { opacity: 1; }
    /* PWA: no fade — opacity pop reads as a flash on open */
    html.pwa-standalone #earth-canvas {
      transition: none;
    }
    #earth-canvas:active { cursor: grabbing; }

    .chrome {
      position: fixed;
      z-index: 4;
      left: 0;
      right: 0;
      top: 0;
      height: calc(0.375in + env(safe-area-inset-top, 0px));
      padding:
        env(safe-area-inset-top, 0px)
        max(1rem, env(safe-area-inset-right))
        0
        max(1rem, env(safe-area-inset-left));
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      text-align: center;
    }

    /* Same title treatment as Solar Dashboard (Michroma), CamelCase */
    .build-mark {
      position: absolute;
      right: max(0.45rem, env(safe-area-inset-right));
      bottom: 1px;
      z-index: 5;
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 0.04em;
      color: var(--faint);
      line-height: 1;
      pointer-events: none;
    }

    .app-title {
      margin: 0;
      font-family: "Michroma", var(--font), system-ui, sans-serif;
      font-weight: 400;
      font-size: clamp(1.05rem, 3.2vmin, 1.35rem); /* match LightSlice title */
      letter-spacing: 0.1em;
      line-height: 1.15;
      color: var(--text);
      text-align: center;
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.55);
    }

    /*
     * Bottom metrics: one quiet panel, compact instrument rows.
     * pointer-events:none on shell — only controls capture so 2fs works over empty areas.
     * Moon zooms over this; un-zoom / Live to use the controls.
     */
    .loc-bar {
      position: fixed;
      z-index: 3;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      padding:
        0.1rem
        max(0.3rem, env(safe-area-inset-right))
        max(0.3rem, env(safe-area-inset-bottom, 0px))
        max(0.3rem, env(safe-area-inset-left));
      background: transparent;
      pointer-events: none;
      touch-action: none;
      display: flex;
      flex-direction: column;
      gap: 0.12rem;
    }

    /* iPad: sit the slider just above the app-switch swipe. 0.2in extra. */
    html.is-tablet .loc-bar {
      padding-bottom: calc(max(0.3rem, env(safe-area-inset-bottom, 0px)) + 0.2in);
    }

    .zoom-readout {
      align-self: center;
      margin: 0 0 0.1rem;
      padding: 0.08rem 0.4rem;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.04em;
      color: var(--dim);
      line-height: 1.2;
    }

    .loc-bar input,
    .loc-bar button,
    .loc-bar input[type="range"],
    .loc-bar .cycle,
    .loc-bar .cycle-controls,
    .loc-bar .slider-track {
      pointer-events: auto;
      touch-action: manipulation;
    }

    /* Horizontal scrub must win over page/globe pan on iPad Safari */
    .loc-bar #phase-slider {
      touch-action: pan-x;
    }

    :root {
      --m-row-h: 1.7rem;
      --m-cell-pad: 2px 0.4rem;
      --m-cell-gap: 1px;
    }

    .metrics-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0.18rem 0.14rem;
      display: flex;
      flex-direction: column;
      gap: 0.06rem;
      pointer-events: none;
    }

    .metrics-section {
      display: flex;
      flex-direction: column;
      gap: 0.06rem;
    }

    .metrics-section + .metrics-section {
      margin-top: 0.1rem;
      padding-top: 0.22rem;
      border-top: 1px solid var(--line);
    }

    .metrics-section-label {
      margin: 0 0 0.02rem;
      padding: 0 0.28rem;
      font-family: var(--font);
      font-size: var(--label-size);
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--dim);
      line-height: 1.1;
      pointer-events: none;
    }

    .m-grid {
      display: grid;
      /* Space weather: R·S·G · Kp · Bz · Wind · X-ray */
      grid-template-columns:
        minmax(0, 1.35fr)
        minmax(0, 0.85fr)
        minmax(0, 0.95fr)
        minmax(0, 1.15fr)
        minmax(0, 0.95fr);
      grid-auto-rows: var(--m-row-h);
      gap: 0;
      pointer-events: none;
    }

    /* NOAA tide line — station wide, high/mid/low compact */
    .m-grid-3 {
      grid-template-columns:
        minmax(0, 1.7fr)
        minmax(3.6rem, 0.38fr)
        minmax(3.6rem, 0.38fr)
        minmax(3.6rem, 0.38fr);
      grid-auto-rows: var(--m-row-h);
      gap: 0;
    }

    /* Location takes leftover; sun cells size to their words. */
    .m-grid-rise {
      display: flex;
      align-items: stretch;
      gap: 0;
    }

    .m-grid-rise .loc-cell {
      flex: 1 1 auto;
      min-width: 0;
    }

    .m-grid-rise > .m-cell-fact {
      flex: 0 0 auto;
      width: max-content;
      min-width: max-content;
    }

    .tool-strip {
      display: flex;
      align-items: stretch;
      gap: 4px;
      flex: 1 1 auto;
      justify-self: stretch;
      width: 100%;
      min-width: 0;
      height: 1.1rem;
      max-height: none;
      padding: 0;
      border-radius: 0;
      background: transparent;
      border: none;
      pointer-events: auto;
      box-sizing: border-box;
    }

    #m-station,
    #m-daylen,
    #m-scales,
    #m-wind,
    #m-xray {
      font-size: 11px;
      line-height: 1.1;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .vision-btn {
      flex: 1 1 0;
      width: auto;
      min-width: 0;
      height: 100%;
      min-height: 0;
      border: none;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--dim);
      font-family: var(--font);
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      white-space: nowrap;
      cursor: pointer;
      touch-action: manipulation;
      line-height: 1;
      padding: 0 0.28rem;
      -webkit-tap-highlight-color: transparent;
    }

    /* On only — no hover “third” look */
    .vision-btn[aria-pressed="true"] {
      background: rgba(232, 244, 252, 0.2);
      color: var(--text);
    }

    .m-cell {
      background: transparent;
      border: none;
      border-radius: 0;
      padding: var(--m-cell-pad);
      min-width: 0;
      min-height: var(--m-row-h);
      height: var(--m-row-h);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: stretch;
      gap: var(--m-cell-gap);
      overflow: hidden;
    }

    .m-grid > .m-cell + .m-cell,
    .m-grid-3 > .m-cell + .m-cell,
    .m-grid-rise > * + * {
      box-shadow: inset 1px 0 0 rgba(255, 255, 255, 0.05);
    }

    button.m-cell-fact {
      font: inherit;
      color: inherit;
      text-align: left;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
      touch-action: manipulation;
      pointer-events: auto;
      width: 100%;
    }

    button.m-cell-fact:active {
      background: rgba(255, 255, 255, 0.05);
    }

    .m-cell .k {
      font-size: var(--label-size);
      font-weight: 500;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--dim);
      line-height: 1.1;
      flex: 0 0 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      opacity: 0.9;
    }

    .m-cell .v {
      font-family: var(--font);
      font-weight: 600;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
      line-height: 1.15;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 0 0 auto;
      min-width: 0;
    }

    .m-cell .v.sm { font-size: 11px; }

    /*
     * Tablets (iPad and similar): phone landscape is excluded via min-height.
     * Coarse pointer + both sides ≥600px ≈ tablet class across platforms.
     */
    @media (pointer: coarse) and (min-width: 600px) and (min-height: 600px) {
      :root {
        --m-row-h: 2rem;
        --m-cell-pad: 3px 0.45rem;
        --m-cell-gap: 1px;
        --label-size: 9px;
      }

      .loc-bar {
        max-width: 620px;
        gap: 0.16rem;
        padding-left: max(0.55rem, env(safe-area-inset-left));
        padding-right: max(0.55rem, env(safe-area-inset-right));
      }

      .metrics-panel {
        border-radius: 12px;
        padding: 0.22rem 0.18rem;
        gap: 0.08rem;
      }

      .m-grid {
        grid-template-columns:
          minmax(0, 1.35fr)
          minmax(0, 0.85fr)
          minmax(0, 0.95fr)
          minmax(0, 1.15fr)
          minmax(0, 0.95fr);
      }

      .m-grid-3 {
        grid-template-columns:
          minmax(0, 1.7fr)
          minmax(4.1rem, 0.38fr)
          minmax(4.1rem, 0.38fr)
          minmax(4.1rem, 0.38fr);
      }


      .m-cell .k {
        letter-spacing: 0.03em;
      }

      .m-cell .v,
      .m-cell .v.sm {
        font-size: 13px;
      }

      #m-station {
        font-size: 12px;
      }

      .vision-btn {
        font-size: 9px;
        padding: 0 0.3rem;
      }

      .loc-strip {
        gap: 0.25rem;
      }

      .loc-card {
        max-height: 2.35rem;
        border-radius: 0;
      }

      .tool-strip {
        height: 1.25rem;
        max-height: none;
      }

      .loc-place-row {
        min-height: 1.2rem;
        height: 1.2rem;
        gap: 0.3rem;
      }

      .loc-coords {
        font-size: 13px;
      }

      .loc-place-row button,
      .geo-btn {
        font-size: 10px;
        min-height: 1.2rem;
      }

      .cycle-date {
        font-size: 13px;
      }

      .live-btn,
      .sun-btn {
        font-size: 11px;
        min-height: 1.4rem;
        padding: 0 0.55rem;
      }

      .slider-track {
        height: 56px;
        margin: -6px 0;
        padding: 6px 0;
        box-sizing: content-box;
      }

      #phase-slider {
        height: 56px;
      }

      #phase-slider::-webkit-slider-runnable-track {
        height: 10px;
      }

      #phase-slider::-webkit-slider-thumb {
        width: 44px;
        height: 44px;
        margin-top: -17px;
      }

      #phase-slider::-moz-range-track {
        height: 10px;
      }

      #phase-slider::-moz-range-thumb {
        width: 44px;
        height: 44px;
      }
    }

    /*
     * Phone landscape only (short height). iPad landscape is taller (≥600px)
     * and keeps the normal / tablet layouts. Shrink stats so Earth stays visible.
     */
    @media (orientation: landscape) and (max-height: 500px) {
      .chrome {
        height: calc(0.28in + env(safe-area-inset-top, 0px));
      }

      .app-title {
        font-size: 0.16in;
      }

      .loc-bar {
        max-width: min(620px, 96vw);
        gap: 0.06rem;
        padding-top: 0.06rem;
        /* zoom reduces used layout height on iOS (transform would not) */
        zoom: 0.72;
      }

      :root {
        --m-row-h: 1.35rem;
        --m-cell-pad: 1px 0.28rem;
        --m-cell-gap: 0;
        --label-size: 6.5px;
      }

      .metrics-panel {
        gap: 0.06rem;
      }

      .m-cell .v,
      .m-cell .v.sm {
        font-size: 9px;
      }

      .vision-btn {
        font-size: 7px;
        padding: 0 0.22rem;
      }

      .loc-strip {
        gap: 0.12rem;
      }

      .cycle {
        padding: 0.06rem 0.22rem 0.02rem;
        gap: 0.06rem;
      }
    }

    /* Phone portrait only. iPad and Mac keep the sizes above. */
    @media (pointer: coarse) and (max-width: 599px) {
      .metrics-panel {
        padding: 0.08rem 0.1rem;
        gap: 0.04rem;
      }

      .metrics-section + .metrics-section {
        margin-top: 0.04rem;
        padding-top: 0.1rem;
      }

      .cycle {
        padding: 2px 0.16rem 1px;
        gap: 2px;
      }

      .cycle-controls {
        gap: 0.22rem;
      }

      .slider-track,
      #phase-slider {
        height: 24px;
      }

      #phase-slider::-webkit-slider-runnable-track {
        height: 6px;
      }

      #phase-slider::-webkit-slider-thumb {
        width: 18px;
        height: 18px;
        margin-top: -6px;
      }

      #phase-slider::-moz-range-track {
        height: 6px;
      }

      #phase-slider::-moz-range-thumb {
        width: 18px;
        height: 18px;
      }

      .live-btn,
      .sun-btn {
        box-sizing: border-box;
        height: 24px;
        padding: 0 0.4rem;
        font-size: 10px;
        line-height: 1;
      }
    }

    /* Aurora · Clouds · Rivers · Borders · Globe · Tilt · Orbit */
    .loc-strip {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 0.2rem;
      flex: 0 0 auto;
      align-items: stretch;
      min-height: 0;
    }

    .loc-card {
      display: flex;
      background: transparent;
      border: none;
      border-radius: 0;
      min-width: 0;
      min-height: 0;
      height: auto;
      max-height: 2.05rem;
      box-sizing: border-box;
    }

    .loc-card-place {
      flex-direction: column;
      align-items: stretch;
      justify-content: space-between;
      gap: 0.12rem;
      padding: 0.12rem 0.35rem;
    }

    .loc-label {
      font-size: var(--label-size);
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--dim);
      line-height: 1.15;
      text-align: left;
      margin: 0;
      flex: 0 0 auto;
    }

    .loc-place-row {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      min-width: 0;
      width: 100%;
      flex: 0 0 auto;
      min-height: 1.15rem;
      height: 1.15rem;
    }

    .loc-coords {
      font-family: var(--font);
      font-size: 11px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
      line-height: 1.1;
      flex: 1 1 auto;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }

    .geo-btn {
      flex: 0 0 auto;
      width: 1.4rem;
      height: 1.15rem;
      min-width: 1.4rem;
      padding: 0 !important;
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      line-height: 0;
    }

    .geo-btn svg {
      width: 12px;
      height: 12px;
      display: block;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .loc-card button {
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      font-family: var(--font);
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      padding: 0.08rem 0.26rem;
      cursor: pointer;
      line-height: 1.05;
      white-space: nowrap;
    }

    /* Hidden lat/lon still updated for applyLocation / storage */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Map location picker (Edit) */
    .loc-dialog {
      position: fixed;
      inset: 0;
      z-index: 300;
      margin: 0;
      padding: 0;
      max-width: none;
      max-height: none;
      width: 100%;
      height: 100%;
      border: none;
      background: rgba(2, 3, 8, 0.72);
      color: var(--text);
    }

    .loc-dialog[hidden] {
      display: none !important;
    }

    .loc-dialog-sheet {
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(430px, 100%);
      max-height: calc(100vh - env(safe-area-inset-top, 0px));
      max-height: calc(100dvh - env(safe-area-inset-top, 0px));
      display: flex;
      flex-direction: column;
      gap: 0;
      background: #0a0e16;
      border: 1px solid var(--line);
      border-bottom: none;
      border-radius: 12px 12px 0 0;
      overflow: hidden;
      padding-bottom: max(0.4rem, env(safe-area-inset-bottom));
      box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.55);
      pointer-events: auto;
    }

    .loc-dialog-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.45rem 0.55rem;
      border-bottom: 1px solid var(--line);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--dim);
    }

    .loc-dialog-head button,
    .loc-dialog-foot button {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      font-family: var(--font);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 0.28rem 0.55rem;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
    }

    .loc-dialog-foot button.primary {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.22);
    }

    .loc-map {
      flex: 1 1 auto;
      height: 75vh;
      height: 75dvh;
      min-height: 0;
      width: 100%;
      background: #12161e;
      z-index: 0;
      touch-action: none;
    }

    .loc-dialog-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.4rem 0.55rem 0.15rem;
    }

    .loc-map-coords {
      font-family: var(--font);
      font-size: 11px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Fact sheet outside .loc-bar so full-screen overlay receives taps */
    .fact-sheet {
      position: fixed;
      z-index: 20;
      left: 0;
      right: 0;
      bottom: 0;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        max(0.75rem, env(safe-area-inset-top))
        max(0.75rem, env(safe-area-inset-right))
        max(0.75rem, env(safe-area-inset-bottom))
        max(0.75rem, env(safe-area-inset-left));
      background: transparent;
      pointer-events: auto;
      touch-action: manipulation;
    }

    .fact-sheet[hidden] {

    function sameGridPick(ll) {
      if (!lastGridPick || !ll) return false;

      );
      if (px < 80) return true;
      let dlon = ll.lon - lastGridPick.lon;
      while (dlon > 180) dlon -= 360;
      while (dlon < -180) dlon += 360;
      const clat = Math.cos((ll.lat * Math.PI) / 180);
      const deg = Math.hypot(ll.lat - lastGridPick.lat, dlon * clat);
      return deg < 1.6;
    }

    function fmtTime(date) {

      const ap = h >= 12 ? "p" : "a";

    function xrayClass(flux) {
      if (!(flux > 0)) return "—";
      const bands = [
        [1e-4, "X"],
        [1e-5, "M"],
        [1e-6, "C"],
        [1e-7, "B"],
        [1e-8, "A"],
      ];
      for (const [thr, letter] of bands) {
        if (flux >= thr) return letter + (flux / thr).toFixed(1);
      }
      return "A" + (flux / 1e-8).toFixed(1);
    }

    function lastActive(rows, pick) {
      if (!Array.isArray(rows)) return null;
      let best = null;
      let bestT = -Infinity;
      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        if (!row || !row.active || pick(row) == null) continue;
        const t = Date.parse(row.time_tag);
        if (!Number.isFinite(t) || t < bestT) continue;
        best = row;
        bestT = t;
      }
      return best;
    }

    function pushAurora(coords, drive) {
      auroraGrid = Array.isArray(coords) ? coords : null;
      const g = globeRef.current;
      if (g && typeof g.setAurora === "function") g.setAurora(auroraGrid, drive);
    }

    /** Four-hour weighted Newell coupling from the active solar-wind spacecraft. */
    function newellDrive(mag, wind) {
      if (!Array.isArray(mag) || !Array.isArray(wind)) return null;
      const speeds = [];
      for (let i = 0; i < wind.length; i++) {
        const row = wind[i];
        if (!row || row.active === false) continue;
        const v = Number(row.proton_speed);
        const t = Date.parse(row.time_tag);
        if (v > 50 && Number.isFinite(t)) speeds.push([t, v]);
      }
      speeds.sort((a, b) => a[0] - b[0]);
      function speedAt(t) {
        let best = null;
        let bestd = 1e18;
        for (let i = 0; i < speeds.length; i++) {
          const d = Math.abs(speeds[i][0] - t);
          if (d < bestd) {
            bestd = d;
            best = speeds[i][1];
          }
        }
        return bestd < 180000 ? best : null;
      }
      function coupling(by, bz, v) {
        const bt = Math.hypot(by, bz);
        const bztemp = bz === 0 ? 0.001 : bz;
        let tc = Math.atan2(by, bztemp);
        if (bt * Math.cos(tc) * bz < 0) tc += Math.PI;
        return (v ** 1.33333) * (Math.abs(Math.sin(tc / 2)) ** 2.66667) * (bt ** 0.66667);
      }
      const pts = [];
      for (let i = 0; i < mag.length; i++) {
        const row = mag[i];
        if (!row || row.active === false) continue;
        const by = Number(row.by_gsm);
        const bz = Number(row.bz_gsm);
        const t = Date.parse(row.time_tag);
        if (!Number.isFinite(by) || !Number.isFinite(bz) || !Number.isFinite(t)) continue;
        const v = speedAt(t);
        if (!v) continue;
        pts.push([t, coupling(by, bz, v)]);
      }
      if (!pts.length) return null;
      pts.sort((a, b) => a[0] - b[0]);
      const now = pts[pts.length - 1][0];
      const hours = [];
      for (let h = 3; h >= 0; h--) {
        let sum = 0;
        let n = 0;
        for (let i = 0; i < pts.length; i++) {
          const age = now - pts[i][0];
          if (age >= h * 3600000 && age < (h + 1) * 3600000) {
            sum += pts[i][1];
            n++;
          }
        }
        hours.push(n ? sum / n : null);
      }
      const wts = [0.65 ** 3, 0.65 ** 2, 0.65, 1];
      let num = 0;
      let den = 0;
      for (let i = 0; i < hours.length; i++) {
        if (hours[i] == null) continue;
        num += hours[i] * wts[i];
        den += wts[i];
      }
      if (!den) return null;
      return { dF: num / den, when: new Date(now) };
    }

    function fmtSigned(n, digits = 1) {
      if (!Number.isFinite(n)) return "—";
      return `${n > 0 ? "+" : ""}${n.toFixed(digits)}`;
    }

    function scaleDigit(block) {
      if (!block || block.Scale == null || block.Scale === "") return "0";
      const n = Number(block.Scale);
      return Number.isFinite(n) ? String(Math.max(0, Math.min(5, Math.round(n)))) : "0";
    }

    async function loadFeeds(forceHeavy) {
      if (feedsBusy) return;
      feedsBusy = true;
      const heavy = forceHeavy || Date.now() - heavyAt > 5 * 60 * 1000;
      try {
        const jobs = [
          fetch("https://services.swpc.noaa.gov/products/noaa-scales.json"),
          fetch("https://services.swpc.noaa.gov/json/planetary_k_index_1m.json"),
          fetch("https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_1m.json"),
          fetch("https://services.swpc.noaa.gov/json/rtsw/rtsw_mag_1m.json"),
          fetch("https://services.swpc.noaa.gov/json/goes/primary/xrays-6-hour.json"),
        ];
        if (heavy) {
          jobs.push(
            fetch("https://services.swpc.noaa.gov/json/ovation_aurora_latest.json")
          );
        }
        const res = await Promise.all(jobs.map((p) => p.then((r) => (r.ok ? r.json() : null)).catch(() => null)));
        const [scales, kp, wind, mag, xray, ovation] = res;

        const nowScale = scales && typeof scales === "object" ? scales["0"] : null;
        if (nowScale) {
          feed.scales = `R${scaleDigit(nowScale.R)} S${scaleDigit(nowScale.S)} G${scaleDigit(nowScale.G)}`;
        }
        if (Array.isArray(kp) && kp.length) {
          const row = kp[kp.length - 1];
          const n = Number(row.estimated_kp);
          if (Number.isFinite(n)) feed.kp = n.toFixed(1);
        }
        const w = lastActive(wind, (r) => (r.proton_speed > 0 ? r.proton_speed : null));
        if (w) {
          windKms = Number(w.proton_speed);
          feed.wind = `${Math.round(windKms)} km/s`;
        }
        const b = lastActive(mag, (r) => (Number.isFinite(Number(r.bz_gsm)) ? r.bz_gsm : null));
        if (b) {
          lastBz = Number(b.bz_gsm);
          feed.bz = fmtSigned(lastBz);
        }
        if (Array.isArray(xray)) {
          const row = [...xray].reverse().find((r) => r && r.energy === "0.1-0.8nm" && r.flux > 0);
          if (row) feed.xray = xrayClass(Number(row.flux));
        }

        const drive = newellDrive(mag, wind);
        if (heavy) {
          heavyAt = Date.now();
          const coords = ovation && (ovation.coordinates || ovation.Coordinates);
          if (Array.isArray(coords) && coords.length) pushAurora(coords, drive);
        } else if (drive && auroraGrid && globeRef.current && typeof globeRef.current.setAurora === "function") {
          globeRef.current.setAurora(auroraGrid, drive);
        }
      } catch (_) {
        /* keep last good numbers */
      } finally {
        feedsBusy = false;
      }
    }

    function dayPhase01(date = new Date()) {
      const h = date.getHours() + date.getMinutes() / 60 + date.getSeconds() / 3600;
      return h / 24;
    }

    /** Local midnight → next midnight. Live thumb sits on the current hour. */
    function dateFromDayPhase(targetPhase, refDate = new Date()) {
      const p = Math.min(1, Math.max(0, Number(targetPhase) || 0));
      const start = new Date(refDate.getFullYear(), refDate.getMonth(), refDate.getDate());
      return new Date(start.getTime() + p * 86400000);
    }

    function sunEventOnDay(A, obs, dir, dayStart) {
      const dayEnd = new Date(dayStart.getTime() + 86400000);
      let t = new Date(dayStart.getTime() - 20 * 3600000);
      for (let i = 0; i < 4; i++) {
        const ev = A.SearchRiseSet(A.Body.Sun, obs, dir, t, 2);
        if (!ev || !ev.date) return null;
        if (ev.date >= dayStart && ev.date < dayEnd) return ev.date;
        if (ev.date >= dayEnd) return null;
        t = new Date(ev.date.getTime() + 60000);
      }
      return null;
    }

    function fmtSpan(ms) {
      if (!(ms > 0)) return "—";
      const min = Math.round(ms / 60000);
      const h = Math.floor(min / 60);
      const m = min % 60;
      return `${h}h ${String(m).padStart(2, "0")}m`;
    }

    function ymdCompact(d) {
      const y = d.getUTCFullYear();
      const m = String(d.getUTCMonth() + 1).padStart(2, "0");
      const day = String(d.getUTCDate()).padStart(2, "0");
      return `${y}${m}${day}`;
    }

    function haversineKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const p1 = (lat1 * Math.PI) / 180;
      const p2 = (lat2 * Math.PI) / 180;
      const dp = ((lat2 - lat1) * Math.PI) / 180;
      const dl = ((lon2 - lon1) * Math.PI) / 180;
      const a =
        Math.sin(dp / 2) ** 2 +
        Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
      return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
    }

    function normalizeStationList(rawList, { requireTypeR = false } = {}) {
      return (rawList || [])
        .filter(
          (s) =>
            s &&
            s.id &&
            Number.isFinite(Number(s.lat)) &&
            Number.isFinite(Number(s.lng)) &&
            (!requireTypeR || s.type === "R" || s.type == null)
        )
        .map((s) => ({
          id: String(s.id),
          lat: Number(s.lat),
          lng: Number(s.lng),
          name: String(s.name || s.id)
            .trim()
            .replace(/\s+/g, " ")
            .replace(/\s*,\s*/g, ", "),
          state: s.state ? String(s.state).trim() : "",
        }))
        .filter((s) => !INLAND_STATION_RE.test(s.name));
    }

    async function fetchStationsFromNetwork() {
      try {
        const res = await fetch(NOAA_STATIONS_PROXY);
        if (res.ok) {
          const data = await res.json();
          const list = normalizeStationList(data.stations || data.list || []);
          if (list.length >= 10) return list;
        }
      } catch (_) {}
      const res = await fetch(NOAA_STATIONS_DIRECT);
      if (!res.ok) throw new Error("stations fetch failed");
      const data = await res.json();
      const list = normalizeStationList(data.stations || [], { requireTypeR: true });
      if (list.length < 10) throw new Error("stations list empty");
      return list;
    }

    function loadTideStations() {
      if (stationsPromise) return stationsPromise;
      stationsPromise = (async () => {
        try {
          const raw = localStorage.getItem(TIDE_STATIONS_KEY);
          if (raw) {
            const o = JSON.parse(raw);
            if (
              o?.ts &&
              Date.now() - o.ts < 7 * 86400000 &&
              Array.isArray(o.list) &&
              o.list.length > 50
            ) {
              return o.list;
            }
          }
        } catch (_) {}
        const list = await fetchStationsFromNetwork();
        try {
          localStorage.setItem(
            TIDE_STATIONS_KEY,
            JSON.stringify({ ts: Date.now(), list })
          );
        } catch (_) {}
        return list;
      })().catch((err) => {
        stationsPromise = null;
        throw err;
      });
      return stationsPromise;
    }

    function nearestTideStation(list, lat, lon) {
      let best = null;
      let bestD = Infinity;
      for (let i = 0; i < list.length; i++) {
        const s = list[i];
        const d = haversineKm(lat, lon, s.lat, s.lng);
        if (d < bestD) {
          bestD = d;
          best = s;
        }
      }
      return best ? { station: best, km: bestD } : null;
    }

    function parseNoaaGmt(t) {
      if (!t || typeof t !== "string") return null;
      const d = new Date(t.replace(" ", "T") + "Z");
      return Number.isNaN(d.getTime()) ? null : d;
    }

    async function fetchHiloPredictions(stationId, when) {
      const now = Date.now();
      let t = when instanceof Date ? when.getTime() : now;
      if (!Number.isFinite(t)) t = now;
      t = Math.min(now + 40 * 86400000, Math.max(now - 20 * 86400000, t));
      const start = new Date(t - 6 * 3600000);
      const end = new Date(t + 48 * 3600000);
      const begin = ymdCompact(start);
      const endStr = ymdCompact(end);

      async function parsePredictions(res) {
        if (!res.ok) throw new Error("predictions failed");
        const data = await res.json();
        if (data?.error?.message) throw new Error(data.error.message);
        if (data?.message === "Forbidden") throw new Error("predictions forbidden");
        if (!Array.isArray(data.predictions)) throw new Error("no predictions");
        return data.predictions;
      }

      try {
        const res = await fetch(
          `${NOAA_HILO_PROXY}?` +
            new URLSearchParams({ station: stationId, begin, end: endStr }).toString()
        );
        return await parsePredictions(res);
      } catch (_) {}

      const res = await fetch(
        `${NOAA_HILO_DIRECT}?` +
          new URLSearchParams({
            product: "predictions",
            application: "superearth-app",
            begin_date: begin,
            end_date: endStr,
            datum: "MLLW",
            station: stationId,
            time_zone: "gmt",
            units: "english",
            interval: "hilo",
            format: "json",
          }).toString()
      );
      return parsePredictions(res);
    }

    function nextExtremes(predictions, when) {
      let nextH = null;
      let nextL = null;
      const t0 = when.getTime();
      for (const p of predictions) {
        const dt = parseNoaaGmt(p.t);
        if (!dt || dt.getTime() < t0 - 60000) continue;
        if (p.type === "H" && !nextH) nextH = dt;
        if (p.type === "L" && !nextL) nextL = dt;
        if (nextH && nextL) break;
      }
      if (!nextH || !nextL) {
        for (const p of predictions) {
          const dt = parseNoaaGmt(p.t);
          if (!dt) continue;
          if (p.type === "H" && !nextH) nextH = dt;
          if (p.type === "L" && !nextL) nextL = dt;
        }
      }
      return { nextH, nextL };
    }

    function midTideBetween(nextH, nextL) {
      if (!(nextH instanceof Date) || !(nextL instanceof Date)) return null;
      const a = nextH.getTime();
      const b = nextL.getTime();
      if (!Number.isFinite(a) || !Number.isFinite(b)) return null;
      return new Date((a + b) / 2);
    }

    function formatTideStationLabel(st) {
      if (!st) return "—";
      let name = (st.name || st.id || "").trim().replace(/\s+/g, " ");
      name = name.replace(/\s*,\s*/g, ", ");
      const state = (st.state || "").trim().toUpperCase();
      let label = name;
      if (name && state) {
        const re = new RegExp(`,\\s*${state}$`, "i");
        label = re.test(name) ? name : `${name}, ${state}`;
      } else {
        label = name || st.id || "—";
      }
      const parts = label.split(", ").filter(Boolean);
      if (parts.length >= 3 && label.length > 22) {
        label = `${parts[0]}, ${parts[parts.length - 1]}`;
      }
      return label;
    }

    function paintTideFields({ station, title, high, mid, low }, seq) {
      if (seq !== tideSeq) return;
      if (station != null) {
        el.station.textContent = station;
        if (title != null) el.station.title = title;
      }
      if (high != null) el.htide.textContent = high;
      if (mid != null) el.mtide.textContent = mid;
      if (low != null) el.ltide.textContent = low;
    }

    function tideQueryKey(lat, lon, when) {
      return (
        Number(lat).toFixed(3) +
        "|" +
        Number(lon).toFixed(3) +
        "|" +
        Math.floor(when.getTime() / 60000)
      );
    }

    async function updateTidesNow(lat, lon, when, key) {
      const seq = ++tideSeq;
      if (!Number.isFinite(lat) || !Number.isFinite(lon) || !(when instanceof Date)) {
        paintTideFields({ station: "—", high: "—", mid: "—", low: "—" }, seq);
        return;
      }
      if (!lastTideStationLabel) {
        paintTideFields({ station: "…", high: "…", mid: "…", low: "…" }, seq);
      }
      try {
        const list = await loadTideStations();
        if (seq !== tideSeq) return;
        const near = nearestTideStation(list, lat, lon);
        if (!near?.station) {
          paintTideFields(
            lastTideStationLabel
              ? { high: "—", mid: "—", low: "—" }
              : { station: "—", high: "—", mid: "—", low: "—" },
            seq
          );
          return;
        }
        const place = formatTideStationLabel(near.station);
        let fullName = (near.station.name || "").trim().replace(/\s+/g, " ").replace(/\s*,\s*/g, ", ");
        const st = (near.station.state || "").trim().toUpperCase();
        if (fullName && st && !new RegExp(`,\\s*${st}$`, "i").test(fullName)) {
          fullName = `${fullName}, ${st}`;
        }
        lastTideStationLabel = place;
        paintTideFields(
          { station: place, title: `${fullName || place} · ${Math.round(near.km)} km away` },
          seq
        );
        try {
          const preds = await fetchHiloPredictions(near.station.id, when);
          if (seq !== tideSeq) return;
          const { nextH, nextL } = nextExtremes(preds, when);
          if (key) lastTideQueryKey = key;
          paintTideFields(
            {
              high: fmtTime(nextH),
              mid: fmtTime(midTideBetween(nextH, nextL)),
              low: fmtTime(nextL),
            },
            seq
          );
        } catch (_) {
          paintTideFields({ high: "—", mid: "—", low: "—" }, seq);
        }
      } catch (_) {
        if (seq !== tideSeq) return;
        paintTideFields(
          lastTideStationLabel
            ? { station: lastTideStationLabel, high: "—", mid: "—", low: "—" }
            : { station: "—", high: "—", mid: "—", low: "—" },
          seq
        );
      }
    }

    function updateTides(lat, lon, when) {
      if (!Number.isFinite(lat) || !Number.isFinite(lon) || !(when instanceof Date)) {
        return;
      }
      const key = tideQueryKey(lat, lon, when);
      if (key === lastTideQueryKey) return;
      if (tideTimer) clearTimeout(tideTimer);
      tideTimer = setTimeout(() => {
        tideTimer = 0;
        updateTidesNow(lat, lon, when, key);
      }, 80);
    }

    function computeMetrics(info) {
      const A = globalThis.Astronomy;
      if (!A || !info) return null;
      const when = info.when instanceof Date ? info.when : new Date(info.when);
      const lat = Number(info.lat);
      const lon = Number(info.lon);
      const dayStart = new Date(when.getFullYear(), when.getMonth(), when.getDate());
      let rise = null;
      let high = null;
      let set = null;
      let dayLen = "—";
      try {
        if (Number.isFinite(lat) && Number.isFinite(lon)) {
          const obs = new A.Observer(lat, lon, 0);
          rise = sunEventOnDay(A, obs, +1, dayStart);
          set = sunEventOnDay(A, obs, -1, dayStart);
          const noon = A.SearchHourAngle(A.Body.Sun, obs, 0, dayStart, 1);
          if (noon && noon.time && noon.time.date >= dayStart) {
            const end = new Date(dayStart.getTime() + 86400000);
            if (noon.time.date < end) high = noon.time.date;
          }
          if (rise && set) {
            let ms = set.getTime() - rise.getTime();
            if (ms < 0) ms += 86400000;
            dayLen = fmtSpan(ms);
          } else {
            const time = A.MakeTime(new Date(dayStart.getTime() + 12 * 3600000));
            const sun = A.Equator(A.Body.Sun, time, obs, true, true);
            const hor = A.Horizon(time, obs, sun.ra, sun.dec, "normal");
            dayLen = hor.altitude > 0 ? "24h" : "0h";
          }
        }
      } catch (_) {}

      return {
        phase01: dayPhase01(when),
        rise,
        high,
        set,
        dayLen,
        lat,
        lon,
        when,
      };
    }

    function paintMetrics(info) {
      const m = computeMetrics(info);
      if (!m) return;
      if (!previewMode && Number.isFinite(m.phase01)) syncSliderToPhase01(m.phase01);

      el.scales.textContent = feed.scales;
      el.kp.textContent = feed.kp;
      el.bz.textContent = feed.bz;
      el.wind.textContent = feed.wind;
      el.xray.textContent = feed.xray;
      el.rise.textContent = fmtTime(m.rise);
      el.high.textContent = fmtTime(m.high);
      el.set.textContent = fmtTime(m.set);
      el.daylen.textContent = m.dayLen;
      cycleDate.textContent = fmtDateTime(m.when);
      updateTides(m.lat, m.lon, m.when);
    }

    function showPhase(info) {
      if (!info) return;
      if (metricsRaf) cancelAnimationFrame(metricsRaf);
      metricsRaf = requestAnimationFrame(() => {
        metricsRaf = 0;
        paintMetrics(info);
      });
    }

    /** Put slider thumb at phase 0…1 (new→new). Matches cycle-day metric. */
    function syncSliderToPhase01(phase01) {
      if (!phaseSlider) return;
      const p = Number(phase01);
      if (!Number.isFinite(p)) return;
      const v = Math.round(Math.min(1, Math.max(0, p)) * 1000);
      phaseSlider.value = String(v);
    }

    function goLive() {
      previewMode = false;
      try {
        if (typeof closeLocationDialog === "function") closeLocationDialog();
      } catch (_) {}
      const now = new Date();
      let info = null;
      try {
        info = globe.setTime(now, { lockOrient: false });
        globe.resetView();
        setTiltUi(false);
      } catch (err) {
        console.warn("goLive setTime/resetView", err);
      }
      // Prefer ephemeris phase (same source as “Cycle day”) so thumb matches
      const p =
        info && Number.isFinite(info.phase01)
          ? info.phase01
          : dayPhase01(now);
      syncSliderToPhase01(p);
      showPhase(info || globe.getPhaseInfo());
      setLiveUI();
    }

    // Block copy / select (showcase PWA); inputs still selectable via CSS

          openLineSheet(ll.line);
          return;

        closePoleSheet();
        closeLineSheet();

            return;

          openGridTap(ll);
          return;

        if (!ll) {
          closePlaceSheet();
          return;
        }
        const place = placeAt(ll.lat, ll.lon);
        if (place) openPlaceSheet(place);
        else closePlaceSheet();
      },
    });

    function applyLocation(lat, lon, source) {
      globe.setObserver(lat, lon);
      if (!previewMode) {

        globe.setTime(dateFromDayPhase(phase), {

    phaseSlider.addEventListener("input", () => {

      previewRaf = requestAnimationFrame(() => {

    let liveAt = 0;

    function setMapPin(lat, lon, pan = false) {
      pickLat = lat;
      pickLon = lon;
      updateMapCoordsDisplay();
      if (!locationMap || typeof L === "undefined") return;
      if (!locationMarker) {
        locationMarker = L.marker([lat, lon], { draggable: true }).addTo(
          locationMap
        );
        locationMarker.on("dragend", () => {
          const p = locationMarker.getLatLng();
          setMapPin(p.lat, p.lng);

    let leafletPromise = null;

    function loadLeaflet() {
      if (typeof L !== "undefined") return Promise.resolve();
      if (leafletPromise) return leafletPromise;
      leafletPromise = new Promise((resolve, reject) => {
        const css = document.createElement("link");
        css.rel = "stylesheet";
        css.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
        css.crossOrigin = "anonymous";
        document.head.appendChild(css);
        const script = document.createElement("script");
        script.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
        script.crossOrigin = "anonymous";
        script.onload = () => resolve();
        script.onerror = () => {
          leafletPromise = null;
          reject(new Error("map"));
        };
        document.head.appendChild(script);
      });
      return leafletPromise;
    }

      const startLat = Number(latInput.value);
      const startLon = Number(lonInput.value);
      pickLat = Number.isFinite(startLat) ? startLat : 0;
      pickLon = Number.isFinite(startLon) ? startLon : 0;
      locDialog.hidden = false;
      loadLeaflet()
        .then(() => {
          requestAnimationFrame(() => {
            initLocationMap();
            if (!locationMap) return;
            const hasLoc =
              Number.isFinite(startLat) &&
              Number.isFinite(startLon) &&
              !(startLat === 0 && startLon === 0);
            const zoom = hasLoc ? 10 : 3;
            locationMap.setView([pickLat, pickLon], zoom);
            setMapPin(pickLat, pickLon);
            locationMap.invalidateSize();
          });
        })
        .catch(() => {
          locCoords.textContent = "Map failed";
        });
    }

    locDialogCancel.addEventListener("click", () => closeLocationDialog());
    locDialog.addEventListener("click", (e) => {
      // Tap dimmed backdrop (not the sheet) closes
      if (e.target === locDialog) closeLocationDialog();
    });
    locDialogUse.addEventListener("click", () => {
      if (!Number.isFinite(pickLat) || !Number.isFinite(pickLon)) return;
      applyLocation(pickLat, pickLon, "map");
      closeLocationDialog();
      if (!previewMode) goLive();
    });

    function requestUserLocation({ force = false } = {}) {
      if (!navigator.geolocation) {
        if (!loadSavedLoc()) applyDefaultLocation();
        return;
      }
      // Browsers block GPS on plain http://LAN-IP — need https (or localhost)
      if (
        typeof window.isSecureContext === "boolean" &&
        !window.isSecureContext &&
        location.hostname !== "localhost" &&
        location.hostname !== "127.0.0.1"
      ) {
        locCoords.title =
          "GPS needs HTTPS on this device.";
        if (!loadSavedLoc() && !force) {
          applyDefaultLocation();
          return;
        }
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          applyLocation(pos.coords.latitude, pos.coords.longitude, "gps");
          if (!previewMode) goLive();
        },
        () => {
          if (!loadSavedLoc()) applyDefaultLocation();
        },
        { enableHighAccuracy: false, timeout: 12000, maximumAge: 60000 }
      );
    }

    // Boot: saved or Asheville default first; GPS refines when allowed.
    // Never open the map picker automatically (X / denied permission stay usable).
    const saved = loadSavedLoc();
    if (saved) {
      applyLocation(saved.lat, saved.lon, saved.source || "saved");
    } else {
      applyDefaultLocation();
    }
    goLive();
    refreshFeeds(true);
    requestAnimationFrame(() => {
      goLive();
      requestUserLocation({ force: false });
    });

    function tickLive() {
      if (previewMode || document.hidden) return;
      globe.setTime(new Date(), { lockOrient: false });
      const p = dayPhase01();
      phaseSlider.value = String(Math.round(p * 1000));
      showPhase(globe.getPhaseInfo());
      refreshFeeds(false);
    }

    setInterval(tickLive, 60000);
    document.addEventListener("visibilitychange", tickLive);

    function pwaFillHeightPx() {
      const iw = window.innerWidth || 0;
      const ih = window.innerHeight || 0;
      const sw = window.screen.width || 0;
      const sh = window.screen.height || 0;
      // iOS keeps screen.* in portrait metrics; pick the axis for current height.
      if (ih >= iw) return Math.max(ih, Math.max(sw, sh));
      return Math.max(ih, Math.min(sw, sh));
    }

    /** iPad PWA: screen.* undershoots CSS inner — phone uses screen height instead. */
    function pwaExtraBottomPx() {
      const iw = window.innerWidth || 0;
      const ih = window.innerHeight || 0;
      const sw = window.screen.width || 0;
      const sh = window.screen.height || 0;
      const screenMax = Math.max(sw, sh);
      if (Math.min(iw, ih) < 600) return 0;
      if (screenMax >= ih - 10) return 0;
      return Math.max(readSafeInsetBottom(), 20);
    }

    function syncPwaFillHeight() {
      const root = document.documentElement;
      if (!root.classList.contains("pwa-standalone")) {
        root.style.removeProperty("--pwa-fill-h");
        root.style.removeProperty("--pwa-extra-b");
        return 0;
      }
      const fillH = pwaFillHeightPx();
      const extra = pwaExtraBottomPx();
      root.style.setProperty("--pwa-fill-h", `${fillH}px`);
      root.style.setProperty("--pwa-extra-b", `${extra}px`);
      return fillH + extra;
    }

    function readSafeInsetBottom() {
      const probe = document.createElement("div");
      probe.style.cssText =
        "position:fixed;visibility:hidden;pointer-events:none;padding-bottom:env(safe-area-inset-bottom,0px)";
      document.body.appendChild(probe);
      const px = parseFloat(getComputedStyle(probe).paddingBottom) || 0;
      probe.remove();
      return px;
    }

    function onResize() {
      syncPwaFillHeight();
      globe.fitToHost();
    }
    window.addEventListener("resize", onResize);
    window.addEventListener("orientationchange", () => {
      setTimeout(onResize, 50);
      setTimeout(onResize, 300);
    });
    window.visualViewport?.addEventListener("resize", onResize);
    window.addEventListener("pageshow", onResize);
    syncPwaFillHeight();
    onResize();
    setTimeout(onResize, 100);
    setTimeout(onResize, 400);
  </script>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
