    /* iOS A2HS: lock fill height before first paint.
       Phone: screen.height > inner → use screen.
       iPad: screen.* often *undershoots* inner → add safe-area extra. */
    (function () {
      var n = window.navigator;
      var standalone =
        n.standalone === true ||
        window.matchMedia("(display-mode: standalone)").matches ||
        window.matchMedia("(display-mode: fullscreen)").matches;
      if (!standalone) return;
      var root = document.documentElement;
      root.classList.add("pwa-standalone");
      var iw = window.innerWidth || 0;
      var ih = window.innerHeight || 0;
      var sw = window.screen.width || 0;
      var sh = window.screen.height || 0;
      var screenMax = Math.max(sw, sh);
      var screenMin = Math.min(sw, sh);
      var fillH = ih >= iw ? Math.max(ih, screenMax) : Math.max(ih, screenMin);
      var extra = 0;
      if (Math.min(iw, ih) >= 600 && screenMax < ih - 10) {
        extra = 20; /* refined to real insetB once body exists */
      }
      root.style.setProperty("--pwa-fill-h", fillH + "px");
      root.style.setProperty("--pwa-extra-b", extra + "px");
    })();
  </script>

  <style>
    :root {
      color-scheme: dark;
      --text: #e8f4fc;
      --muted: #7eb8d8;
      --dim: #6aa8cc;
      --faint: #4a88a8;
      --cell: transparent;
      --panel: rgba(18, 22, 30, 0.58);
      --line: rgba(42, 49, 64, 0.65);
      --moon: #c8d0e0;
      --mono: "Inter", system-ui, sans-serif;
      --font: "Inter", system-ui, sans-serif;
      /* Compact instrument labels */
      --label-size: 8px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      min-height: -webkit-fill-available;
      overflow: hidden;
      background: #020308;
      color: var(--text);
      font-family: var(--font);
      -webkit-text-size-adjust: 100%;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    input,
    textarea {
      -webkit-user-select: text;
      user-select: text;
    }

    /*
     * Full-bleed GL stack. Do NOT use max-height:100dvh — undershoots on iOS.
     * Safari: env() overpaint. Home-screen PWA: height locked to screen (see JS)
     * because innerHeight stays short of screen.height and clips env() overshoot.
     */
    #stage,
    #moon-host,
    #touch-plane {
      position: fixed;
      top: calc(-1 * env(safe-area-inset-top, 0px));
      right: calc(-1 * env(safe-area-inset-right, 0px));
      bottom: calc(-1 * env(safe-area-inset-bottom, 0px));
      left: calc(-1 * env(safe-area-inset-left, 0px));
    }

    html.pwa-standalone,
    html.pwa-standalone body {
      height: calc(var(--pwa-fill-h, 100%) + var(--pwa-extra-b, 0px));
      min-height: calc(var(--pwa-fill-h, 100%) + var(--pwa-extra-b, 0px));
    }

    html.pwa-standalone #stage,
    html.pwa-standalone #moon-host,
    html.pwa-standalone #touch-plane {
      top: 0;
      right: 0;
      bottom: auto;
      left: 0;
      width: 100%;
      height: calc(var(--pwa-fill-h, 100%) + var(--pwa-extra-b, 0px));
    }

    /* Clips the oversized GL canvas; black matches clear color */
    #moon-host {
      z-index: 1;
      overflow: hidden;
      background: #020308;
    }

    /* Gesture layer above canvas, under real UI controls */
    #touch-plane {
      z-index: 2;
      touch-action: none;
      background: transparent;
    }

    #moon-canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
      opacity: 0;
      transition: opacity 0.2s ease;
      background: #020308;
    }

    #moon-canvas.is-ready { opacity: 1; }
    /* PWA: no fade — opacity pop reads as a flash on open */
    html.pwa-standalone #moon-canvas {
      transition: none;
    }
    #moon-canvas:active { cursor: grabbing; }

    .chrome {
      position: fixed;
      z-index: 4;
      left: 0;
      right: 0;
      top: 0;
      height: calc(0.375in + env(safe-area-inset-top, 0px));
      padding:
        env(safe-area-inset-top, 0px)
        max(1rem, env(safe-area-inset-right))
        0
        max(1rem, env(safe-area-inset-left));
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      text-align: center;
    }

    /* Same title treatment as Solar Dashboard (Michroma), CamelCase */
    .build-mark {
      position: absolute;
      right: max(0.45rem, env(safe-area-inset-right));
      bottom: 1px;
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 0.04em;
      color: var(--faint);
      line-height: 1;
    }

    .app-title {
      margin: 0;
      font-family: "Michroma", var(--font), system-ui, sans-serif;
      font-weight: 400;
      font-size: clamp(1.05rem, 3.2vmin, 1.35rem); /* match LightSlice title */
      letter-spacing: 0.1em;
      line-height: 1.15;
      color: var(--text);
      text-align: center;
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.55);
    }

    /*
     * Bottom metrics: one quiet panel, compact instrument rows.
     * pointer-events:none on shell — only controls capture so 2fs works over empty areas.
     * Moon zooms over this; un-zoom / Live to use the controls.
     */
    .loc-bar {
      position: fixed;
      z-index: 3;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      padding:
        0.1rem
        max(0.3rem, env(safe-area-inset-right))
        max(0.3rem, env(safe-area-inset-bottom, 0px))
        max(0.3rem, env(safe-area-inset-left));
      background: transparent;
      pointer-events: none;
      touch-action: none;
      display: flex;
      flex-direction: column;
      gap: 0.12rem;
    }

    .loc-bar input,
    .loc-bar button,
    .loc-bar input[type="range"],
    .loc-bar .cycle,
    .loc-bar .cycle-controls,
    .loc-bar .slider-track {
      pointer-events: auto;
      touch-action: manipulation;
    }

    /* Horizontal scrub must win over page/globe pan on iPad Safari */
    .loc-bar #phase-slider {
      touch-action: pan-x;
    }

    :root {
      --m-row-h: 1.7rem;
      --m-cell-pad: 2px 0.4rem;
      --m-cell-gap: 1px;
    }

    .metrics-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0.18rem 0.14rem;
      display: flex;
      flex-direction: column;
      gap: 0.06rem;
      pointer-events: none;
    }

    .metrics-section {
      display: flex;
      flex-direction: column;
      gap: 0.06rem;
    }

    .metrics-section + .metrics-section {
      margin-top: 0.1rem;
      padding-top: 0.22rem;
      border-top: 1px solid var(--line);
    }

    .metrics-section-label {
      margin: 0 0 0.02rem;
      padding: 0 0.28rem;
      font-family: var(--font);
      font-size: var(--label-size);
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--dim);
      line-height: 1.1;
      pointer-events: none;
    }

    .m-grid {
      display: grid;
      /* 4 across → rows 1–2 of space weather wrap naturally */
      grid-template-columns: 1.35fr 0.9fr 1fr 0.85fr;
      grid-auto-rows: var(--m-row-h);
      gap: 0;
      pointer-events: none;
    }

    /* NOAA tide line — station wide, high/mid/low compact */
    .m-grid-3 {
      grid-template-columns:
        minmax(0, 1.7fr)
        minmax(3.6rem, 0.38fr)
        minmax(3.6rem, 0.38fr)
        minmax(3.6rem, 0.38fr);
      grid-auto-rows: var(--m-row-h);
      gap: 0;
    }

    /* Sunrise, solar noon, sunset, day length */
    .m-grid-rise {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-auto-rows: var(--m-row-h);
      align-items: stretch;
      gap: 0;
    }

    .tool-strip {
      display: flex;
      align-items: stretch;
      gap: 1px;
      flex: 0 0 auto;
      min-width: 0;
      width: auto;
      height: 100%;
      max-height: 2.05rem;
      padding: 1px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.05);
      border: none;
      pointer-events: auto;
      box-sizing: border-box;
    }

    #m-station,
    #m-daylen {
      font-size: 11px;
      line-height: 1.1;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .vision-btn {
      flex: 1 1 0;
      min-width: 2.85rem;
      width: 2.85rem;
      height: 100%;
      min-height: 0;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: var(--dim);
      font-family: var(--font);
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      touch-action: manipulation;
      line-height: 1;
      padding: 0 0.35rem;
      -webkit-tap-highlight-color: transparent;
    }

    /* On only — no hover “third” look */
    .vision-btn[aria-pressed="true"] {
      background: rgba(232, 244, 252, 0.18);
      color: var(--text);
    }

    body.is-red-mode .vision-btn {
      background: transparent;
      color: var(--dim);
    }

    body.is-red-mode .vision-btn[aria-pressed="true"] {
      background: rgba(200, 28, 36, 0.55);
      color: var(--text);
    }

    .m-cell {
      background: transparent;
      border: none;
      border-radius: 0;
      padding: var(--m-cell-pad);
      min-width: 0;
      min-height: var(--m-row-h);
      height: var(--m-row-h);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: stretch;
      gap: var(--m-cell-gap);
      overflow: hidden;
    }

    .m-grid > .m-cell + .m-cell,
    .m-grid-3 > .m-cell + .m-cell,
    .m-grid-rise > .m-cell + .m-cell {
      box-shadow: inset 1px 0 0 rgba(255, 255, 255, 0.05);
    }

    button.m-cell-fact {
      font: inherit;
      color: inherit;
      text-align: left;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
      touch-action: manipulation;
      width: 100%;
    }

    button.m-cell-fact:active {
      background: rgba(255, 255, 255, 0.05);
    }

    .m-cell .k {
      font-size: var(--label-size);
      font-weight: 500;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--dim);
      line-height: 1.1;
      flex: 0 0 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      opacity: 0.9;
    }

    .m-cell .v {
      font-family: var(--font);
      font-weight: 600;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
      line-height: 1.15;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 0 0 auto;
      min-width: 0;
    }

    .m-cell .v.sm { font-size: 11px; }
    .m-cell .v.moon {
      color: var(--moon);
      font-size: 11px;
      letter-spacing: -0.015em;
    }

    /*
     * Tablets (iPad and similar): phone landscape is excluded via min-height.
     * Coarse pointer + both sides ≥600px ≈ tablet class across platforms.
     */
    @media (pointer: coarse) and (min-width: 600px) and (min-height: 600px) {
      :root {
        --m-row-h: 2rem;
        --m-cell-pad: 3px 0.45rem;
        --m-cell-gap: 1px;
        --label-size: 9px;
      }

      .loc-bar {
        max-width: 620px;
        gap: 0.16rem;
        padding-left: max(0.55rem, env(safe-area-inset-left));
        padding-right: max(0.55rem, env(safe-area-inset-right));
      }

      .metrics-panel {
        border-radius: 12px;
        padding: 0.22rem 0.18rem;
        gap: 0.08rem;
      }

      .m-grid {
        grid-template-columns: 1.35fr 0.9fr 1fr 0.85fr;
      }

      .m-grid-3 {
        grid-template-columns:
          minmax(0, 1.7fr)
          minmax(4.1rem, 0.38fr)
          minmax(4.1rem, 0.38fr)
          minmax(4.1rem, 0.38fr);
      }

      .m-grid-rise {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .m-cell .k {
        letter-spacing: 0.03em;
      }

      .m-cell .v,
      .m-cell .v.sm,
      .m-cell .v.moon {
        font-size: 13px;
      }

      #m-station {
        font-size: 12px;
      }

      .vision-btn {
        font-size: 10px;
        min-width: 3.1rem;
        width: 3.1rem;
        padding: 0 0.4rem;
      }

      .loc-strip {
        gap: 0.25rem;
      }

      .loc-card {
        max-height: 2.35rem;
        border-radius: 0;
      }

      .tool-strip {
        max-height: 2.35rem;
      }

      .loc-place-row {
        min-height: 1.2rem;
        height: 1.2rem;
        gap: 0.3rem;
      }

      .loc-coords {
        font-size: 13px;
      }

      .loc-place-row button,
      .geo-btn {
        font-size: 10px;
        min-height: 1.2rem;
      }

      .cycle-date {
        font-size: 13px;
      }

      .live-btn {
        font-size: 11px;
        min-height: 1.4rem;
        padding: 0 0.55rem;
      }

      .slider-track {
        height: 56px;
        margin: -6px 0;
        padding: 6px 0;
        box-sizing: content-box;
      }

      #phase-slider {
        height: 56px;
      }

      #phase-slider::-webkit-slider-runnable-track {
        height: 10px;
      }

      #phase-slider::-webkit-slider-thumb {
        width: 44px;
        height: 44px;
        margin-top: -17px;
      }

      #phase-slider::-moz-range-track {
        height: 10px;
      }

      #phase-slider::-moz-range-thumb {
        width: 44px;
        height: 44px;
      }
    }

    /*
     * Phone landscape only (short height). iPad landscape is taller (≥600px)
     * and keeps the normal / tablet layouts. Shrink stats so the moon stays visible.
     */
    @media (orientation: landscape) and (max-height: 500px) {
      .chrome {
        height: calc(0.28in + env(safe-area-inset-top, 0px));
      }

      .app-title {
        font-size: 0.16in;
      }

      .loc-bar {
        max-width: min(620px, 96vw);
        gap: 0.06rem;
        padding-top: 0.06rem;
        /* zoom reduces used layout height on iOS (transform would not) */
        zoom: 0.72;
      }

      :root {
        --m-row-h: 1.35rem;
        --m-cell-pad: 1px 0.28rem;
        --m-cell-gap: 0;
        --label-size: 6.5px;
      }

      .metrics-panel {
        gap: 0.06rem;
      }

      .m-cell .v,
      .m-cell .v.sm,
      .m-cell .v.moon {
        font-size: 9px;
      }

      .vision-btn {
        font-size: 7px;
        min-width: 2.4rem;
        width: 2.4rem;
        padding: 0 0.2rem;
      }

      .loc-strip {
        gap: 0.12rem;
      }

      .cycle {
        padding: 0.06rem 0.22rem 0.02rem;
        gap: 0.06rem;
      }
    }

    /* Phone portrait: trim space under slider / Live row */
    @media (pointer: coarse) and (max-width: 599px) {
      .cycle {
        padding-bottom: 1px;
      }
    }

    /* Location + Clouds/Clear · Red · Orbit */
    .loc-strip {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.2rem;
      flex: 0 0 auto;
      align-items: stretch;
      min-height: 0;
    }

    .loc-card {
      display: flex;
      background: transparent;
      border: none;
      border-radius: 0;
      min-width: 0;
      min-height: 0;
      height: auto;
      max-height: 2.05rem;
      box-sizing: border-box;
    }

    .loc-card-place {
      flex-direction: column;
      align-items: stretch;
      justify-content: space-between;
      gap: 0.12rem;
      padding: 0.12rem 0.35rem;
    }

    .loc-label {
      font-size: var(--label-size);
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--dim);
      line-height: 1.15;
      text-align: left;
      margin: 0;
      flex: 0 0 auto;
    }

    .loc-place-row {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      min-width: 0;
      width: 100%;
      flex: 0 0 auto;
      min-height: 1.15rem;
      height: 1.15rem;
    }

    .loc-coords {
      font-family: var(--font);
      font-size: 11px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
      line-height: 1.1;
      flex: 1 1 auto;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }

    .geo-btn {
      flex: 0 0 auto;
      width: 1.4rem;
      height: 1.15rem;
      min-width: 1.4rem;
      padding: 0 !important;
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      line-height: 0;
    }

    .geo-btn svg {
      width: 12px;
      height: 12px;
      display: block;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .loc-card button {
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      font-family: var(--font);
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      padding: 0.08rem 0.26rem;
      cursor: pointer;
      line-height: 1.05;
      white-space: nowrap;
    }

    /* Hidden lat/lon still updated for applyLocation / storage */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Map location picker (Edit) */
    .loc-dialog {
      position: fixed;
      inset: 0;
      z-index: 300;
      margin: 0;
      padding: 0;
      max-width: none;
      max-height: none;
      width: 100%;
      height: 100%;
      border: none;
      background: rgba(2, 3, 8, 0.72);
      color: var(--text);
    }

    .loc-dialog[hidden] {
      display: none !important;
    }

    .loc-dialog-sheet {
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(430px, 100%);
      max-height: min(78vh, 560px);
      display: flex;
      flex-direction: column;
      gap: 0;
      background: #0a0e16;
      border: 1px solid var(--line);
      border-bottom: none;
      border-radius: 12px 12px 0 0;
      overflow: hidden;
      padding-bottom: max(0.4rem, env(safe-area-inset-bottom));
      box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.55);
      pointer-events: auto;
    }

    .loc-dialog-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.45rem 0.55rem;
      border-bottom: 1px solid var(--line);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--dim);
    }

    .loc-dialog-head button,
    .loc-dialog-foot button {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      font-family: var(--font);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 0.28rem 0.55rem;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
    }

    .loc-dialog-foot button.primary {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.22);
    }

    .loc-map {
      height: min(48vh, 340px);
      width: 100%;
      background: #12161e;
      z-index: 0;
      touch-action: none;
    }

    .loc-dialog-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.4rem 0.55rem 0.15rem;
    }

    .loc-map-coords {
      font-family: var(--font);
      font-size: 11px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    body.is-red-mode button.m-cell-fact:active {
      background: rgba(40, 4, 4, 0.55);
    }

    /* Fact sheet outside .loc-bar so full-screen overlay receives taps */
    .fact-sheet {
      position: fixed;
      z-index: 20;
      left: 0;
      right: 0;
      bottom: 0;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        max(0.75rem, env(safe-area-inset-top))
        max(0.75rem, env(safe-area-inset-right))
        max(0.75rem, env(safe-area-inset-bottom))
        max(0.75rem, env(safe-area-inset-left));
      background: rgba(0, 0, 0, 0.62);
      pointer-events: auto;
      touch-action: manipulation;
    }

    .fact-sheet[hidden] {
      display: none !important;
    }

    /* Real button behind the card — iOS won't reliably click empty overlay divs */
    .fact-sheet-scrim {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      border: none;
      border-radius: 0;
      background: transparent;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .fact-sheet-inner {
      position: relative;
      z-index: 1;
      width: min(360px, 100%);
      padding: 16px 16px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #0c1018;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
      pointer-events: auto;
    }

    .fact-sheet-inner h2 {
      font-family: var(--font);
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin: 0 0 10px;
      color: var(--text);
    }

    .fact-sheet-inner p {
      font-size: 13px;
      line-height: 1.45;
      color: var(--dim);
      margin: 0 0 12px;
      white-space: pre-wrap;
    }

    .fact-sheet-inner p.fact-credit {
      margin: 12px 0 0;
      font-size: 10px;
      letter-spacing: 0.02em;
      color: var(--faint);
    }

    .fact-sheet-close {
      margin-top: 4px;
      width: 100%;
      border: 1px solid var(--line);
      background: var(--cell);
      color: var(--text);
      font: inherit;
      font-weight: 600;
      padding: 9px;
      border-radius: 7px;
      cursor: pointer;
      touch-action: manipulation;
    }

    body.is-red-mode .fact-sheet-inner {
      background: #0a0000;
      border-color: #3a0c0c;
    }

    body.is-red-mode .fact-sheet-close {
      background: rgba(40, 4, 4, 0.55);
      border-color: #3a0c0c;
    }

    body.is-red-mode .loc-dialog {
      background: rgba(2, 0, 0, 0.8);
    }

    body.is-red-mode .loc-dialog-sheet {
      background: #0a0000;
      border-color: #3a0c0c;
    }

    body.is-red-mode .loc-dialog-head button,
    body.is-red-mode .loc-dialog-foot button {
      background: rgba(40, 4, 4, 0.55);
      border-color: #3a0c0c;
      color: var(--text);
    }

    body.is-red-mode .loc-map {
      background: #0c0000;
      /* Red cast that keeps map labels/roads readable */
      filter: sepia(0.9) hue-rotate(-52deg) saturate(3.8) brightness(0.58) contrast(1.02);
    }

    .cycle {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0.1rem 0.28rem 0.1rem;
      display: grid;
      gap: 0.08rem;
      flex: 0 0 auto;
      position: relative;
      z-index: 2;
    }

    .cycle-date {
      font-family: var(--font);
      font-size: 11px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
      color: var(--text);
      line-height: 1.05;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    /* Slider shortened; Live sits after it in the freed width */
    .cycle-controls {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      min-width: 0;
    }

    .slider-track {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
      height: 32px;
      display: flex;
      align-items: center;
      margin: 0;
      padding: 0;
      box-sizing: content-box;
    }

    #phase-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 32px;
      margin: 0;
      background: transparent;
      cursor: pointer;
      pointer-events: auto;
      touch-action: pan-x;
    }

    #phase-slider::-webkit-slider-runnable-track {
      height: 8px;
      border-radius: 4px;
      background: rgba(200, 212, 232, 0.28);
    }

    #phase-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      margin-top: -7px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: #e8edf7;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
    }

    #phase-slider::-moz-range-track {
      height: 8px;
      border-radius: 4px;
      background: rgba(200, 212, 232, 0.28);
      border: none;
    }

    #phase-slider::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: #e8edf7;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
    }

    .live-btn {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.28rem 0.55rem;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
      font-family: var(--font);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
      line-height: 1.1;
      white-space: nowrap;
      z-index: 2;
    }

    .live-btn.is-preview {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.28);
    }



    .status {
      position: fixed;
      z-index: 2;
      left: 0;

      const ap = h >= 12 ? "p" : "a";

    function xrayClass(flux) {
      if (!(flux > 0)) return "—";
      const bands = [
        [1e-4, "X"],
        [1e-5, "M"],
        [1e-6, "C"],
        [1e-7, "B"],
        [1e-8, "A"],
      ];

        const c = coords[i];
        if (!c || c.length < 3) continue;
        const lon = Math.round(Number(c[0]));
        const lat = Math.round(Number(c[1]));
        const a = Number(c[2]);
        if (!Number.isFinite(lon) || !Number.isFinite(lat) || !Number.isFinite(a)) continue;
        const x = ((lon % 360) + 360) % 360;
        const y = lat + 90;
        if (y < 0 || y > 180) continue;
        arr[y * 360 + x] = a;
      }
      auroraIndex = arr;
    }

    /** Overhead at the pin. OVATION cells are [lon, lat, aurora]. */
    function auroraAt(lat, lon) {
      if (auroraIndex) {
        const x = ((Math.round(Number(lon)) % 360) + 360) % 360;
        const y = Math.max(0, Math.min(180, Math.round(Number(lat)) + 90));
        const v = auroraIndex[y * 360 + x];
        return v < 0 ? null : v;
      }
      const coords = auroraGrid;
      if (!coords || !coords.length) return null;
      let best = null;
      let bestD = 1e9;
      const lo0 = ((Number(lon) % 360) + 360) % 360;
      for (let i = 0; i < coords.length; i++) {
        const c = coords[i];
        if (!c || c.length < 3) continue;
        const dlat = Number(c[1]) - lat;
        let dlon = Number(c[0]) - lo0;
        if (dlon > 180) dlon -= 360;
        if (dlon < -180) dlon += 360;
        const d = dlat * dlat + dlon * dlon;
        if (d < bestD) {
          bestD = d;
          best = Number(c[2]);
        }
      }
      return best;
    }

    /**
     * Metric for the Aurora box: peak in the observer’s hemisphere so the
     * number tracks the oval you see on the globe. Mid-latitude pins are
     * often 0 overhead while the oval is lit.
     */
    function auroraHemispherePeak(lat) {
      if (auroraIndex) {
        const southern = Number(lat) < 0;
        const y0 = southern ? 0 : 90;
        const y1 = southern ? 89 : 180;
        let peak = -1;
        for (let y = y0; y <= y1; y++) {
          const row = y * 360;
          for (let x = 0; x < 360; x++) {
            const v = auroraIndex[row + x];
            if (v > peak) peak = v;
          }
        }
        return peak < 0 ? null : peak;
      }
      const coords = auroraGrid;
      if (!coords || !coords.length) return null;
      const southern = Number(lat) < 0;
      let peak = -1;
      for (let i = 0; i < coords.length; i++) {
        const c = coords[i];
        if (!c || c.length < 3) continue;
        const la = Number(c[1]);
        if (southern ? la < 0 : la >= 0) {
          const a = Number(c[2]);
          if (a > peak) peak = a;
        }
      }
      return peak < 0 ? null : peak;
    }

    function pushAurora(coords) {
      auroraGrid = Array.isArray(coords) ? coords : null;
      buildAuroraIndex(auroraGrid);
      const g = globeRef.current;
      if (g && typeof g.setAurora === "function") g.setAurora(auroraGrid);
    }

    function fmtSigned(n, digits = 1) {
      if (!Number.isFinite(n)) return "—";
      return `${n > 0 ? "+" : ""}${n.toFixed(digits)}`;
    }

    async function loadFeeds(forceHeavy) {
      if (feedsBusy) return;
      feedsBusy = true;
      const heavy = forceHeavy || Date.now() - heavyAt > 5 * 60 * 1000;
      try {
        const jobs = [
          fetch("https://services.swpc.noaa.gov/json/planetary_k_index_1m.json"),
          fetch("https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_1m.json"),
          fetch("https://services.swpc.noaa.gov/json/rtsw/rtsw_mag_1m.json"),
          fetch("https://services.swpc.noaa.gov/json/goes/primary/xrays-6-hour.json"),
          fetch("https://services.swpc.noaa.gov/products/kyoto-dst.json"),
        ];
        if (heavy) {
          jobs.push(
            fetch("https://services.swpc.noaa.gov/json/ovation_aurora_latest.json")
          );
        }
        const res = await Promise.all(jobs.map((p) => p.then((r) => (r.ok ? r.json() : null)).catch(() => null)));
        const [kp, wind, mag, xray, dst, ovation] = res;

        if (Array.isArray(kp) && kp.length) {
          const row = kp[kp.length - 1];
          const n = Number(row.estimated_kp);
          if (Number.isFinite(n)) feed.kp = n.toFixed(1);
        }
        const w = lastActive(wind, (r) => (r.proton_speed > 0 ? r.proton_speed : null));
        if (w) feed.wind = `${Math.round(w.proton_speed)} km/s`;
        const dens = lastActive(wind, (r) =>
          Number(r.proton_density) > 0 ? r.proton_density : null
        );
        if (dens) {
          const n = Number(dens.proton_density);
          feed.density = n >= 10 ? String(Math.round(n)) : n.toFixed(1);
        }
        const b = lastActive(mag, (r) => (Number.isFinite(Number(r.bz_gsm)) ? r.bz_gsm : null));
        if (b) feed.bz = fmtSigned(Number(b.bz_gsm));
        const btRow = lastActive(mag, (r) =>
          Number(r.bt) > 0 ? r.bt : null
        );
        if (btRow) feed.bt = Number(btRow.bt).toFixed(1);
        if (Array.isArray(xray)) {
          const row = [...xray].reverse().find((r) => r && r.energy === "0.1-0.8nm" && r.flux > 0);
          if (row) feed.xray = xrayClass(Number(row.flux));
        }

        if (Array.isArray(dst) && dst.length) {
          const row = dst[dst.length - 1];
          const n = Number(row.dst != null ? row.dst : row[1]);
          if (Number.isFinite(n)) feed.dst = fmtSigned(n, 0);
        }

        if (heavy) {
          heavyAt = Date.now();
          const coords = ovation && (ovation.coordinates || ovation.Coordinates);
          if (Array.isArray(coords) && coords.length) pushAurora(coords);
        }
      } catch (_) {
        /* keep last good numbers */
      } finally {
        feedsBusy = false;
      }
    }

    function refreshFeeds(heavy) {
      loadFeeds(!!heavy).then(() => {
        if (globeRef.current) showPhase(globeRef.current.getPhaseInfo());
      });
    }

    function saveLoc(lat, lon, source) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ lat, lon, source }));
      } catch (_) {}
    }

    function loadSavedLoc() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const o = JSON.parse(raw);
        if (!Number.isFinite(o.lat) || !Number.isFinite(o.lon)) return null;
        return o;
      } catch (_) {
        return null;
      }
    }

    function dayPhase01(date = new Date()) {
      const h = date.getHours() + date.getMinutes() / 60 + date.getSeconds() / 3600;
      return h / 24;
    }

    /** Local midnight → next midnight. Live thumb sits on the current hour. */
    function dateFromDayPhase(targetPhase, refDate = new Date()) {
      const p = Math.min(1, Math.max(0, Number(targetPhase) || 0));
      const start = new Date(refDate.getFullYear(), refDate.getMonth(), refDate.getDate());
      return new Date(start.getTime() + p * 86400000);
    }

    function sunEventOnDay(A, obs, dir, dayStart) {
      const dayEnd = new Date(dayStart.getTime() + 86400000);
      let t = new Date(dayStart.getTime() - 20 * 3600000);
      for (let i = 0; i < 4; i++) {
        const ev = A.SearchRiseSet(A.Body.Sun, obs, dir, t, 2);
        if (!ev || !ev.date) return null;
        if (ev.date >= dayStart && ev.date < dayEnd) return ev.date;
        if (ev.date >= dayEnd) return null;
        t = new Date(ev.date.getTime() + 60000);
      }
      return null;
    }

    function fmtSpan(ms) {
      if (!(ms > 0)) return "—";
      const min = Math.round(ms / 60000);
      const h = Math.floor(min / 60);
      const m = min % 60;
      return `${h}h ${String(m).padStart(2, "0")}m`;
    }

    function ymdCompact(d) {
      const y = d.getUTCFullYear();
      const m = String(d.getUTCMonth() + 1).padStart(2, "0");
      const day = String(d.getUTCDate()).padStart(2, "0");
      return `${y}${m}${day}`;
    }

    function haversineKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const p1 = (lat1 * Math.PI) / 180;
      const p2 = (lat2 * Math.PI) / 180;
      const dp = ((lat2 - lat1) * Math.PI) / 180;
      const dl = ((lon2 - lon1) * Math.PI) / 180;
      const a =
        Math.sin(dp / 2) ** 2 +
        Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
      return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
    }

    function normalizeStationList(rawList, { requireTypeR = false } = {}) {
      return (rawList || [])
        .filter(
          (s) =>
            s &&
            s.id &&
            Number.isFinite(Number(s.lat)) &&
            Number.isFinite(Number(s.lng)) &&
            (!requireTypeR || s.type === "R" || s.type == null)
        )
        .map((s) => ({
          id: String(s.id),
          lat: Number(s.lat),
          lng: Number(s.lng),
          name: String(s.name || s.id)
            .trim()
            .replace(/\s+/g, " ")
            .replace(/\s*,\s*/g, ", "),
          state: s.state ? String(s.state).trim() : "",
        }))
        .filter((s) => !INLAND_STATION_RE.test(s.name));
    }

    async function fetchStationsFromNetwork() {
      try {
        const res = await fetch(NOAA_STATIONS_PROXY);
        if (res.ok) {
          const data = await res.json();
          const list = normalizeStationList(data.stations || data.list || []);
          if (list.length >= 10) return list;
        }
      } catch (_) {}
      const res = await fetch(NOAA_STATIONS_DIRECT);
      if (!res.ok) throw new Error("stations fetch failed");
      const data = await res.json();
      const list = normalizeStationList(data.stations || [], { requireTypeR: true });
      if (list.length < 10) throw new Error("stations list empty");
      return list;
    }

    function loadTideStations() {
      if (stationsPromise) return stationsPromise;
      stationsPromise = (async () => {
        try {
          const raw = localStorage.getItem(TIDE_STATIONS_KEY);
          if (raw) {
            const o = JSON.parse(raw);
            if (
              o?.ts &&
              Date.now() - o.ts < 7 * 86400000 &&
              Array.isArray(o.list) &&
              o.list.length > 50
            ) {
              return o.list;
            }
          }
        } catch (_) {}
        const list = await fetchStationsFromNetwork();
        try {
          localStorage.setItem(
            TIDE_STATIONS_KEY,
            JSON.stringify({ ts: Date.now(), list })
          );
        } catch (_) {}
        return list;
      })().catch((err) => {
        stationsPromise = null;
        throw err;
      });
      return stationsPromise;
    }

    function nearestTideStation(list, lat, lon) {
      let best = null;
      let bestD = Infinity;
      for (let i = 0; i < list.length; i++) {
        const s = list[i];
        const d = haversineKm(lat, lon, s.lat, s.lng);
        if (d < bestD) {
          bestD = d;
          best = s;
        }
      }
      return best ? { station: best, km: bestD } : null;
    }

    function parseNoaaGmt(t) {
      if (!t || typeof t !== "string") return null;
      const d = new Date(t.replace(" ", "T") + "Z");
      return Number.isNaN(d.getTime()) ? null : d;
    }

    async function fetchHiloPredictions(stationId, when) {
      const now = Date.now();
      let t = when instanceof Date ? when.getTime() : now;
      if (!Number.isFinite(t)) t = now;
      t = Math.min(now + 40 * 86400000, Math.max(now - 20 * 86400000, t));
      const start = new Date(t - 6 * 3600000);
      const end = new Date(t + 48 * 3600000);
      const begin = ymdCompact(start);
      const endStr = ymdCompact(end);

      async function parsePredictions(res) {
        if (!res.ok) throw new Error("predictions failed");
        const data = await res.json();
        if (data?.error?.message) throw new Error(data.error.message);
        if (data?.message === "Forbidden") throw new Error("predictions forbidden");
        if (!Array.isArray(data.predictions)) throw new Error("no predictions");
        return data.predictions;
      }

      try {
        const res = await fetch(
          `${NOAA_HILO_PROXY}?` +
            new URLSearchParams({ station: stationId, begin, end: endStr }).toString()
        );
        return await parsePredictions(res);
      } catch (_) {}

      const res = await fetch(
        `${NOAA_HILO_DIRECT}?` +
          new URLSearchParams({
            product: "predictions",
            application: "superearth-app",
            begin_date: begin,
            end_date: endStr,
            datum: "MLLW",
            station: stationId,
            time_zone: "gmt",
            units: "english",
            interval: "hilo",
            format: "json",
          }).toString()
      );
      return parsePredictions(res);
    }

    function nextExtremes(predictions, when) {
      let nextH = null;
      let nextL = null;
      const t0 = when.getTime();
      for (const p of predictions) {
        const dt = parseNoaaGmt(p.t);
        if (!dt || dt.getTime() < t0 - 60000) continue;
        if (p.type === "H" && !nextH) nextH = dt;
        if (p.type === "L" && !nextL) nextL = dt;
        if (nextH && nextL) break;
      }
      if (!nextH || !nextL) {
        for (const p of predictions) {
          const dt = parseNoaaGmt(p.t);
          if (!dt) continue;
          if (p.type === "H" && !nextH) nextH = dt;
          if (p.type === "L" && !nextL) nextL = dt;
        }
      }
      return { nextH, nextL };
    }

    function midTideBetween(nextH, nextL) {
      if (!(nextH instanceof Date) || !(nextL instanceof Date)) return null;
      const a = nextH.getTime();
      const b = nextL.getTime();
      if (!Number.isFinite(a) || !Number.isFinite(b)) return null;
      return new Date((a + b) / 2);
    }

    function formatTideStationLabel(st) {
      if (!st) return "—";
      let name = (st.name || st.id || "").trim().replace(/\s+/g, " ");
      name = name.replace(/\s*,\s*/g, ", ");
      const state = (st.state || "").trim().toUpperCase();
      let label = name;
      if (name && state) {
        const re = new RegExp(`,\\s*${state}$`, "i");
        label = re.test(name) ? name : `${name}, ${state}`;
      } else {
        label = name || st.id || "—";
      }
      const parts = label.split(", ").filter(Boolean);
      if (parts.length >= 3 && label.length > 22) {
        label = `${parts[0]}, ${parts[parts.length - 1]}`;
      }
      return label;
    }

    function paintTideFields({ station, title, high, mid, low }, seq) {
      if (seq !== tideSeq) return;
      if (station != null) {
        el.station.textContent = station;
        if (title != null) el.station.title = title;
      }
      if (high != null) el.htide.textContent = high;
      if (mid != null) el.mtide.textContent = mid;
      if (low != null) el.ltide.textContent = low;
    }

    async function updateTidesNow(lat, lon, when) {
      const seq = ++tideSeq;
      if (!Number.isFinite(lat) || !Number.isFinite(lon) || !(when instanceof Date)) {
        paintTideFields({ station: "—", high: "—", mid: "—", low: "—" }, seq);
        return;
      }
      if (!lastTideStationLabel) {
        paintTideFields({ station: "…", high: "…", mid: "…", low: "…" }, seq);
      } else {
        paintTideFields({ high: "…", mid: "…", low: "…" }, seq);
      }
      try {
        const list = await loadTideStations();
        if (seq !== tideSeq) return;
        const near = nearestTideStation(list, lat, lon);
        if (!near?.station) {
          paintTideFields(
            lastTideStationLabel
              ? { high: "—", mid: "—", low: "—" }
              : { station: "—", high: "—", mid: "—", low: "—" },
            seq
          );
          return;
        }
        const place = formatTideStationLabel(near.station);
        let fullName = (near.station.name || "").trim().replace(/\s+/g, " ").replace(/\s*,\s*/g, ", ");
        const st = (near.station.state || "").trim().toUpperCase();
        if (fullName && st && !new RegExp(`,\\s*${st}$`, "i").test(fullName)) {
          fullName = `${fullName}, ${st}`;
        }
        lastTideStationLabel = place;
        paintTideFields(
          { station: place, title: `${fullName || place} · ${Math.round(near.km)} km away` },
          seq
        );
        try {
          const preds = await fetchHiloPredictions(near.station.id, when);
          if (seq !== tideSeq) return;
          const { nextH, nextL } = nextExtremes(preds, when);
          paintTideFields(
            {
              high: fmtTime(nextH),
              mid: fmtTime(midTideBetween(nextH, nextL)),
              low: fmtTime(nextL),
            },
            seq
          );
        } catch (_) {
          paintTideFields({ high: "—", mid: "—", low: "—" }, seq);
        }
      } catch (_) {
        if (seq !== tideSeq) return;
        paintTideFields(
          lastTideStationLabel
            ? { station: lastTideStationLabel, high: "—", mid: "—", low: "—" }
            : { station: "—", high: "—", mid: "—", low: "—" },
          seq
        );
      }
    }

    function updateTides(lat, lon, when) {
      if (tideTimer) clearTimeout(tideTimer);
      tideTimer = setTimeout(() => {
        tideTimer = 0;
        updateTidesNow(lat, lon, when);
      }, 80);
    }

    function computeMetrics(info) {
      const A = globalThis.Astronomy;
      if (!A || !info) return null;
      const when = info.when instanceof Date ? info.when : new Date(info.when);
      const lat = Number(info.lat);
      const lon = Number(info.lon);
      const dayStart = new Date(when.getFullYear(), when.getMonth(), when.getDate());
      let rise = null;
      let high = null;
      let set = null;
      let dayLen = "—";
      try {
        if (Number.isFinite(lat) && Number.isFinite(lon)) {
          const obs = new A.Observer(lat, lon, 0);
          rise = sunEventOnDay(A, obs, +1, dayStart);
          set = sunEventOnDay(A, obs, -1, dayStart);
          const noon = A.SearchHourAngle(A.Body.Sun, obs, 0, dayStart, 1);
          if (noon && noon.time && noon.time.date >= dayStart) {
            const end = new Date(dayStart.getTime() + 86400000);
            if (noon.time.date < end) high = noon.time.date;
          }
          if (rise && set) {
            let ms = set.getTime() - rise.getTime();
            if (ms < 0) ms += 86400000;
            dayLen = fmtSpan(ms);
          } else {
            const time = A.MakeTime(new Date(dayStart.getTime() + 12 * 3600000));
            const sun = A.Equator(A.Body.Sun, time, obs, true, true);
            const hor = A.Horizon(time, obs, sun.ra, sun.dec, "normal");
            dayLen = hor.altitude > 0 ? "24h" : "0h";
          }
        }
      } catch (_) {}

      const aur = Number.isFinite(lat) ? auroraHemispherePeak(lat) : null;

      return {
        phase01: dayPhase01(when),
        rise,
        high,
        set,
        dayLen,
        lat,
        lon,
        aurora: aur == null ? "—" : `${Math.round(aur)}%`,
        when,
      };
    }

    function paintMetrics(info) {
      const m = computeMetrics(info);
      if (!m) return;
      if (!previewMode && Number.isFinite(m.phase01)) syncSliderToPhase01(m.phase01);

      el.phase.textContent = feed.kp;
      el.illum.textContent = feed.wind;
      el.density.textContent = feed.density;
      el.cycle.textContent = feed.bz;
      el.bt.textContent = feed.bt;
      el.tofull.textContent = feed.xray;
      el.ang.textContent = m.aurora;
      el.dst.textContent = feed.dst;
      el.rise.textContent = fmtTime(m.rise);
      el.high.textContent = fmtTime(m.high);
      el.set.textContent = fmtTime(m.set);
      el.daylen.textContent = m.dayLen;
      cycleDate.textContent = fmtDateTime(m.when);
      updateTides(m.lat, m.lon, m.when);
    }

    function showPhase(info) {
      if (!info) return;
      if (metricsRaf) cancelAnimationFrame(metricsRaf);
      metricsRaf = requestAnimationFrame(() => {
        metricsRaf = 0;
        paintMetrics(info);
      });
    }

    function setLocationTitle(source) {
      if (!locLabel) return;
      // GPS → Current; baked-in fallback → Default; map/hemi/saved → Chosen
      if (source === "gps") locLabel.textContent = "Current location";
      else if (source === "default") locLabel.textContent = "Default location";
      else locLabel.textContent = "Chosen location";
    }

    function applyDefaultLocation() {
      applyLocation(DEFAULT_LOC.lat, DEFAULT_LOC.lon, "default");
    }

    function showLoc(lat, lon, source) {
      latInput.value = Number(lat).toFixed(4);
      lonInput.value = Number(lon).toFixed(4);
      locCoords.textContent = `${fmtCoord(lat, "N", "S")} · ${fmtCoord(lon, "E", "W")}`;
      if (source != null) setLocationTitle(source);
    }

    let cloudsOn = true;

    function setClouds(on) {
      cloudsOn = !!on;
      // Label = next action (same pattern as Red / White)
      cloudsBtn.textContent = cloudsOn ? "Clear" : "Clouds";
      cloudsBtn.setAttribute("aria-pressed", cloudsOn ? "true" : "false");
      cloudsBtn.title = cloudsOn
        ? "Hide the live cloud layer"
        : "Show the live cloud layer";
      if (globeRef.current) globeRef.current.setClouds(cloudsOn);
    }

    function setLiveUI() {
      if (!liveBtn) return;
      liveBtn.classList.toggle("is-preview", previewMode);
      liveBtn.classList.toggle("is-live", !previewMode);
      liveBtn.textContent = previewMode ? "Use live" : "Live";
    }

    /** Put slider thumb at phase 0…1 (new→new). Matches cycle-day metric. */
    function syncSliderToPhase01(phase01) {
      if (!phaseSlider) return;
      const p = Number(phase01);
      if (!Number.isFinite(p)) return;
      const v = Math.round(Math.min(1, Math.max(0, p)) * 1000);
      phaseSlider.value = String(v);
    }

    function goLive() {
      previewMode = false;
      try {
        if (typeof closeLocationDialog === "function") closeLocationDialog();
      } catch (_) {}
      const now = new Date();
      let info = null;
      try {
        info = globe.setTime(now, { lockOrient: false });
        globe.resetView();
      } catch (err) {
        console.warn("goLive setTime/resetView", err);
      }
      // Prefer ephemeris phase (same source as “Cycle day”) so thumb matches
      const p =
        info && Number.isFinite(info.phase01)
          ? info.phase01
          : dayPhase01(now);
      syncSliderToPhase01(p);
      showPhase(info || globe.getPhaseInfo());
      setLiveUI();
    }

    let redModeOn = false;
    const visionBtn = document.getElementById("vision-btn");
    const orbitBtn = document.getElementById("orbit-btn");

    function setRedMode(on) {
      redModeOn = !!on;
      document.body.classList.toggle("is-red-mode", redModeOn);
      // Label = what you get when you press (next action)
      visionBtn.textContent = redModeOn ? "White" : "Red";
      visionBtn.setAttribute("aria-pressed", redModeOn ? "true" : "false");
      visionBtn.title = redModeOn
        ? "Return to normal (white) display"
        : "Night vision: red display for dark-adapted eyes";
    }

    function toggleRedMode() {
      setRedMode(!redModeOn);
    }

    visionBtn.addEventListener("click", (e) => {
      e.preventDefault();
      toggleRedMode();
    });

    function setOrbitUI(on) {
      const active = !!on;
      orbitBtn.setAttribute("aria-pressed", active ? "true" : "false");
      orbitBtn.title = active
        ? "Stop continuous Earth orbit"
        : "Slow continuous Earth orbit (tap again to stop)";
    }

    function startOrbitDefault() {
      if (globe.isOrbiting()) setOrbitUI(true);
      else orbitBtn.click();
    }

    orbitBtn.addEventListener("click", (e) => {
      e.preventDefault();
      const next = !globe.isOrbiting();
      globe.setOrbiting(next);
      setOrbitUI(next);
    });

    // Block copy / select (showcase PWA); inputs still selectable via CSS
    for (const evt of ["copy", "cut", "selectstart"]) {
      document.addEventListener(
        evt,
        (e) => {
          const t = e.target;
          if (t && (t.closest?.("input,textarea") || t.isContentEditable)) return;
          e.preventDefault();
        },
        { capture: true }
      );
    }

    window.addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      if (factSheet && !factSheet.hidden) {
        closeFactSheet();
        return;
      }
      if (!locDialog.hidden) {
        closeLocationDialog();
        return;
      }
      if (redModeOn) setRedMode(false);
      if (globe.isOrbiting()) {
        globe.setOrbiting(false);
        setOrbitUI(false);
      }
    });

    const globe = globeRef.current = createEarthGlobe(canvas, {
      onReady() {
        canvas.classList.add("is-ready");
        status.textContent = "";
        status.style.display = "none";
      },
      onQuality(level) {
        const mark = document.getElementById("build-mark");
        if (mark) mark.textContent = "e45 " + level;
      },
      onPhase: showPhase,
    });

    function applyLocation(lat, lon, source) {
      globe.setObserver(lat, lon);
      if (!previewMode) {
        globe.setTime(new Date(), { lockOrient: false });
      } else {
        const phase = Number(phaseSlider.value) / 1000;
        globe.setTime(dateFromDayPhase(phase), {
          lockOrient: true,
          orientDate: new Date(),
        });
      }
      showLoc(lat, lon, source);
      showPhase(globe.getPhaseInfo());
      saveLoc(lat, lon, source);
    }

    phaseSlider.addEventListener("input", () => {
      previewMode = true;
      setLiveUI();
      const phase = Number(phaseSlider.value) / 1000;
      const date = dateFromDayPhase(phase);
      if (previewRaf) cancelAnimationFrame(previewRaf);
      previewRaf = requestAnimationFrame(() => {
        previewRaf = 0;
        // Freeze sky pose while scrubbing so only terminator walks the cycle
        globe.setTime(date, { lockOrient: true, orientDate: new Date() });
        showPhase(globe.getPhaseInfo());
      });
    });

    function onLiveActivate(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      goLive();
    }

    // click + pointerup: iOS sometimes eats click after touch-action wars
    liveBtn.addEventListener("click", onLiveActivate);
    liveBtn.addEventListener(
      "pointerup",
      (e) => {
        if (e.pointerType === "mouse" && e.button !== 0) return;
        onLiveActivate(e);
      },
      { passive: false }
    );
    cloudsBtn.addEventListener("click", (e) => {
      e.preventDefault();
      setClouds(!cloudsOn);
    });

    function updateMapCoordsDisplay() {
      locMapCoords.textContent = `${fmtCoord(pickLat, "N", "S")} · ${fmtCoord(pickLon, "E", "W")}`;
    }

    function setMapPin(lat, lon, pan = false) {
      pickLat = lat;
      pickLon = lon;
      updateMapCoordsDisplay();
      if (!locationMap || typeof L === "undefined") return;
      if (!locationMarker) {
        locationMarker = L.marker([lat, lon], { draggable: true }).addTo(
          locationMap
        );
        locationMarker.on("dragend", () => {
          const p = locationMarker.getLatLng();
          setMapPin(p.lat, p.lng);
        });
      } else {
        locationMarker.setLatLng([lat, lon]);
      }
      if (pan) locationMap.setView([lat, lon], locationMap.getZoom());
    }

    function initLocationMap() {
      if (locationMap || typeof L === "undefined") return;
      locationMap = L.map(locMapEl, {
        zoomControl: true,
        attributionControl: true,
      });
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap",
      }).addTo(locationMap);
      locationMap.on("click", (e) => setMapPin(e.latlng.lat, e.latlng.lng));
    }

    function closeLocationDialog() {
      locDialog.hidden = true;
    }

    function openLocationDialog() {
      const startLat = Number(latInput.value);
      const startLon = Number(lonInput.value);
      pickLat = Number.isFinite(startLat) ? startLat : 0;
      pickLon = Number.isFinite(startLon) ? startLon : 0;
      locDialog.hidden = false;
      requestAnimationFrame(() => {
        initLocationMap();
        if (!locationMap) return;
        const hasLoc =
          Number.isFinite(startLat) &&
          Number.isFinite(startLon) &&
          !(startLat === 0 && startLon === 0);
        const zoom = hasLoc ? 10 : 3;
        locationMap.setView([pickLat, pickLon], zoom);
        setMapPin(pickLat, pickLon);
        locationMap.invalidateSize();
      });
    }

    editBtn.addEventListener("click", () => openLocationDialog());
    locDialogCancel.addEventListener("click", () => closeLocationDialog());
    locDialog.addEventListener("click", (e) => {
      // Tap dimmed backdrop (not the sheet) closes
      if (e.target === locDialog) closeLocationDialog();
    });
    locDialogUse.addEventListener("click", () => {
      if (!Number.isFinite(pickLat) || !Number.isFinite(pickLon)) return;
      applyLocation(pickLat, pickLon, "map");
      closeLocationDialog();
      if (!previewMode) goLive();
    });

    geoBtn.addEventListener("click", () => {
      if (!navigator.geolocation) {
        locCoords.textContent = "GPS unavailable";
        openLocationDialog();
        return;
      }
      locCoords.textContent = "Locating…";
      geoBtn.disabled = true;
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          geoBtn.disabled = false;
          applyLocation(pos.coords.latitude, pos.coords.longitude, "gps");
          if (!previewMode) goLive();
        },
        (err) => {
          geoBtn.disabled = false;
          locCoords.textContent =
            err.code === 1 ? "Permission denied" : "Location failed";
          openLocationDialog();
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    });

    function requestUserLocation({ force = false } = {}) {
      if (!navigator.geolocation) {
        if (force) openLocationDialog();
        else if (!loadSavedLoc()) applyDefaultLocation();
        return;
      }
      // Browsers block GPS on plain http://LAN-IP — need https (or localhost)
      if (
        typeof window.isSecureContext === "boolean" &&
        !window.isSecureContext &&
        location.hostname !== "localhost" &&
        location.hostname !== "127.0.0.1"
      ) {
        locCoords.title =
          "GPS needs HTTPS on this device. Tap locate on Mac/localhost, or Edit map.";
        if (!loadSavedLoc() && !force) {
          applyDefaultLocation();
          return;
        }
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          applyLocation(pos.coords.latitude, pos.coords.longitude, "gps");
          if (!previewMode) goLive();
        },
        () => {
          if (force) openLocationDialog();
          else if (!loadSavedLoc()) applyDefaultLocation();
        },
        { enableHighAccuracy: false, timeout: 12000, maximumAge: 60000 }
      );
    }

    // Boot: saved or Asheville default first; GPS refines when allowed.
    // Never open the map picker automatically (X / denied permission stay usable).
    const saved = loadSavedLoc();
    if (saved) {
      applyLocation(saved.lat, saved.lon, saved.source || "saved");
    } else {
      applyDefaultLocation();
    }
    goLive();
    refreshFeeds(true);
    requestAnimationFrame(() => {
      goLive();
      startOrbitDefault();
      requestUserLocation({ force: false });
    });

    function tickLive() {
      if (previewMode || document.hidden) return;
      globe.setTime(new Date(), { lockOrient: false });
      const p = dayPhase01();
      phaseSlider.value = String(Math.round(p * 1000));
      showPhase(globe.getPhaseInfo());
      refreshFeeds(false);
    }

    setInterval(tickLive, 60000);
    document.addEventListener("visibilitychange", tickLive);

    function pwaFillHeightPx() {
      const iw = window.innerWidth || 0;
      const ih = window.innerHeight || 0;
      const sw = window.screen.width || 0;
      const sh = window.screen.height || 0;
      // iOS keeps screen.* in portrait metrics; pick the axis for current height.
      if (ih >= iw) return Math.max(ih, Math.max(sw, sh));
      return Math.max(ih, Math.min(sw, sh));
    }

    /** iPad PWA: screen.* undershoots CSS inner — phone uses screen height instead. */
    function pwaExtraBottomPx() {
      const iw = window.innerWidth || 0;
      const ih = window.innerHeight || 0;
      const sw = window.screen.width || 0;
      const sh = window.screen.height || 0;
      const screenMax = Math.max(sw, sh);
      if (Math.min(iw, ih) < 600) return 0;
      if (screenMax >= ih - 10) return 0;
      return Math.max(readSafeInsetBottom(), 20);
    }

    function syncPwaFillHeight() {
      const root = document.documentElement;
      if (!root.classList.contains("pwa-standalone")) {
        root.style.removeProperty("--pwa-fill-h");
        root.style.removeProperty("--pwa-extra-b");
        return 0;
      }
      const fillH = pwaFillHeightPx();
      const extra = pwaExtraBottomPx();
      root.style.setProperty("--pwa-fill-h", `${fillH}px`);
      root.style.setProperty("--pwa-extra-b", `${extra}px`);
      return fillH + extra;
    }

    function readSafeInsetBottom() {
      const probe = document.createElement("div");
      probe.style.cssText =
        "position:fixed;visibility:hidden;pointer-events:none;padding-bottom:env(safe-area-inset-bottom,0px)";
      document.body.appendChild(probe);
      const px = parseFloat(getComputedStyle(probe).paddingBottom) || 0;
      probe.remove();
      return px;
    }

    function onResize() {
      syncPwaFillHeight();
      globe.fitToHost();
    }
    window.addEventListener("resize", onResize);
    window.addEventListener("orientationchange", () => {
      setTimeout(onResize, 50);
      setTimeout(onResize, 300);
    });
    window.visualViewport?.addEventListener("resize", onResize);
    window.addEventListener("pageshow", onResize);
    syncPwaFillHeight();
    onResize();
    setTimeout(onResize, 100);
    setTimeout(onResize, 400);
  </script>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
